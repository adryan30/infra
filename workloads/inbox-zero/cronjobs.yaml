# Quoted curl Authorization header — upstream chart leaves it unquoted and YAML
# parses `Authorization: Bearer` as a map. Synced as a second source of the
# inbox-zero Application (see templates/apps/inbox-zero.yaml).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: inbox-zero-scheduled-actions
  labels:
    app.kubernetes.io/name: inbox-zero
    app.kubernetes.io/component: cron
    app.kubernetes.io/part-of: inbox-zero
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: inbox-zero
            app.kubernetes.io/component: cron
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: curlimages/curl:8.17.0
              imagePullPolicy: IfNotPresent
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: inbox-zero-secret
                      key: CRON_SECRET
                - name: URL
                  value: http://inbox-zero-web:80/api/cron/scheduled-actions
              command:
                - sh
                - -ec
                - 'curl --fail --silent --show-error --location "$URL" -H "Authorization: Bearer $CRON_SECRET"'
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  memory: 128Mi
---

# Chart workaround (ADR-0006): securo's DB password (templates/_sphere.tpl's
# sphere.rolePassword, refreshInterval 24h, generator-backed) rotates to a
# fresh random value every 24h. CNPG picks the new password up almost
# instantly via the sphere-securo Secret's cnpg.io/reload label, but
# backend/mcp-server/worker/beat only read securo-secrets into env vars
# (envFrom) at pod start -- Kubernetes never live-updates env vars from a
# Secret, so every rotation silently breaks DB auth (and with it, OIDC
# login, which touches the DB on callback) until something restarts those
# four Deployments.
#
# The cluster already runs Stakater Reloader (kube-system/reloader-reloader)
# for exactly this -- see inbox-zero's `podAnnotations:
# reloader.stakater.com/auto: "true"` -- but the securo chart
# (securo-finance/securo) exposes no annotations hook on any of its
# Deployment templates (checked templates/{backend,mcp-server,worker,
# beat,frontend}/deployment.yaml), so Reloader can't be wired in via Helm
# values, and Argo's selfHeal would revert a hand-patched annotation on the
# next sync anyway. This CronJob is the workaround until that's fixed
# upstream (adryan30/infra#155) or the chart grows a podAnnotations value.
#
# Schedule: sphere-securo's ExternalSecret refreshes at :15:32 past the hour
# it was first created (00:15:32 UTC) every 24h; CNPG's role reconcile is a
# fast in-place ALTER ROLE, not a restart, so it's done well within minutes.
# 00:30 UTC gives a comfortable margin.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: securo-secret-reloader
  namespace: securo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: securo-secret-reloader
  namespace: securo
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      - securo-backend
      - securo-mcp-server
      - securo-worker
      - securo-beat
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: securo-secret-reloader
  namespace: securo
subjects:
  - kind: ServiceAccount
    name: securo-secret-reloader
    namespace: securo
roleRef:
  kind: Role
  name: securo-secret-reloader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: securo-secret-reload
  labels:
    app.kubernetes.io/name: securo
    app.kubernetes.io/component: cron
    app.kubernetes.io/part-of: securo
spec:
  schedule: "30 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: securo
            app.kubernetes.io/component: cron
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          restartPolicy: OnFailure
          serviceAccountName: securo-secret-reloader
          containers:
            - name: kubectl
              # Pin to the cluster's exact server version (v1.33.5+k3s1).
              image: rancher/kubectl:v1.33.5
              imagePullPolicy: IfNotPresent
              command:
                - kubectl
                - rollout
                - restart
                - deployment/securo-backend
                - deployment/securo-mcp-server
                - deployment/securo-worker
                - deployment/securo-beat
                - -n
                - securo
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi

name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  helm-template:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Render App-of-apps chart
        run: helm template . --debug >/dev/null

{{- if eq (include "workload.enabled" (dict "root" . "name" "storyteller")) "true" }}
apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    pv.kubernetes.io/provisioned-by: rclone.csi.veloxpack.io
  name: pv-storyteller
  namespace: books
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  csi:
    driver: rclone.csi.veloxpack.io
    volumeHandle: data-id
    nodePublishSecretRef:
      name: storyteller-library-drive
      namespace: kube-system
    # remotePath is empty: the storyteller-library-drive secret's rclone
    # config pins root_folder_id to the shared "Storyteller" folder directly
    # (service account has no My Drive of its own — see docs/research/rclone-drive-csi-mount.md).
    volumeAttributes:
      remote: "drive"
      remotePath: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-storyteller
  namespace: books
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  volumeName: pv-storyteller
  storageClassName: ""
{{- end }}

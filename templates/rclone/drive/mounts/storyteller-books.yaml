{{- if eq (include "workload.enabled" (dict "root" . "name" "storyteller")) "true" }}
apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    pv.kubernetes.io/provisioned-by: rclone.csi.veloxpack.io
  name: pv-storyteller-library
  namespace: books
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  csi:
    driver: rclone.csi.veloxpack.io
    volumeHandle: data-id-storyteller-library
    nodePublishSecretRef:
      name: storyteller-library-drive
      namespace: kube-system
    # remotePath is empty: the storyteller-library-drive secret's rclone
    # config pins root_folder_id to the shared "Storyteller" folder directly
    # (service account has no My Drive of its own — see docs/research/rclone-drive-csi-mount.md).
    volumeAttributes:
      remote: "drive"
      remotePath: ""
      # Storyteller's app process runs as uid/gid 1000, not root. FUSE mounts
      # are only visible to the mounting user (root, via kubelet) unless
      # allow_other is set — confirmed live: the app got EPERM/"?" stat
      # results on /library despite correct 755 perms on the underlying files.
      allow_other: "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-storyteller-library
  namespace: books
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  volumeName: pv-storyteller-library
  storageClassName: ""
{{- end }}

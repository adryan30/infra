{{- if eq (include "workload.enabled" (dict "root" . "name" "longhorn")) "true" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  finalizers:
    {{- include "workload.finalizers" . | nindent 4 }}
  labels:
    name: longhorn
spec:
  project: default
  source:
    repoURL: https://charts.longhorn.io
    targetRevision: v1.10.0
    chart: longhorn
    helm:
      valuesObject:
        preUpgradeChecker:
          jobEnabled: true
        # persistence.defaultClassReplicaCount governs the numberOfReplicas
        # StorageClass *parameter* baked into the chart-managed "longhorn"
        # default class -- a StorageClass parameter always wins over the
        # defaultSettings.defaultReplicaCount Setting below at provisioning
        # time, and Longhorn's own chart default for it is 3. Leaving this
        # unset meant every volume through the default class silently got
        # 3 replicas regardless of the Setting (confirmed: all pre-existing
        # volumes are 1-replica, apparently fixed by hand in the Longhorn UI
        # at some point, but each *new* volume reverts to 3 since nothing
        # here overrides the chart's class parameter). "longhorn-low"
        # (templates/storage/longhorn-low.yaml) already pins this to 1
        # explicitly for the same reason.
        persistence:
          defaultClassReplicaCount: 1
        defaultSettings:
          # Fallback for volumes provisioned without a StorageClass
          # numberOfReplicas parameter (e.g. Longhorn-UI-created or DR
          # volumes) -- not effective against the default class itself,
          # see persistence.defaultClassReplicaCount above.
          defaultReplicaCount: "1"
          # guaranteedInstanceManagerCPU defaults to 12% of each node's
          # allocatable CPU per data engine (Longhorn's own setting, not a
          # standard Helm resources: block -- confirmed live via `kubectl
          # get settings.longhorn.io guaranteed-instance-manager-cpu`,
          # value stored as this same JSON-string shape). On this
          # cluster's 4-core nodes that's 480m per instance-manager pod,
          # one per node -- never covered by #116/ADR 0008's original
          # audit, which only looked at templates/apps/*.yaml resources:
          # blocks. `kubectl top` shows actual usage peaking ~120m.
          # Longhorn is one of ADR 0008's named critical components (an
          # outage here is a storage outage), so 6% (~240m, 2x the
          # observed peak) rather than the standard 1.3-1.5x.
          guaranteedInstanceManagerCPU: '{"v1":"6","v2":"6"}'

  destination:
    server: {{ include "workload.destinationServer" . }}
    namespace: longhorn

  info:
    - name: "Homepage:"
      value: "https://longhorn.adryan.me"

  {{- include "workload.syncPolicy" (dict "profile" "platform") | nindent 2 }}
  revisionHistoryLimit: {{ include "workload.revisionHistoryLimit" . }}
{{- end }}

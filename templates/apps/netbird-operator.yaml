{{- if eq (include "workload.enabled" (dict "root" . "name" "netbird")) "true" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netbird-operator
  namespace: argocd
  finalizers:
    {{- include "workload.finalizers" . | nindent 4 }}
  labels:
    name: netbird-operator
spec:
  project: default
  # Multi-source: upstream kubernetes-operator chart + Workload pack (ADR-0006)
  # under workloads/netbird/ (SetupKey + SidecarProfile + egress-test pod —
  # ADR-0007's deferred sidecar-injection wiring, #113).
  sources:
    - repoURL: oci://ghcr.io/netbirdio/helm-charts/netbird-operator
      targetRevision: 0.8.0
      path: .
      helm:
        valuesObject:
          managementURL: "https://netbird-api.adryan.me"
          netbirdAPI:
            keyFromSecret:
              name: netbird-operator-api-key
              key: NB_API_KEY
    - repoURL: git@github.com:adryan30/infra.git
      targetRevision: HEAD
      path: workloads/netbird

  destination:
    server: {{ include "workload.destinationServer" . }}
    namespace: netbird

  {{- include "workload.syncPolicy" (dict "profile" "workload") | nindent 2 }}
  revisionHistoryLimit: {{ include "workload.revisionHistoryLimit" . }}
{{- end }}

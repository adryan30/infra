{{- if eq (include "workload.enabled" (dict "root" . "name" "inbox-zero")) "true" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inbox-zero
  namespace: argocd
  finalizers:
    {{- include "workload.finalizers" . | nindent 4 }}
  labels:
    name: inbox-zero
spec:
  project: default
  # Multi-source: upstream Helm chart + Workload pack (ADR-0006) under
  # workloads/inbox-zero/ (quoted CronJobs; Location EnvoyFilter for 0.0.0.0 redirects).
  sources:
    - repoURL: https://github.com/elie222/inbox-zero
      # Pin: git SHA of elie222/inbox-zero (chart + image short SHA stay in lockstep).
      targetRevision: f753be575534b887af1aa48955af58a619dea3e6
      path: charts/inbox-zero
      helm:
        valuesObject:
          image:
            repository: ghcr.io/elie222/inbox-zero
            tag: "f753be5"
            pullPolicy: IfNotPresent
          podAnnotations:
            reloader.stakater.com/auto: "true"
          ingress:
            enabled: false
          env:
            NODE_ENV: production
            NEXT_PUBLIC_BASE_URL: https://inbox.adryan.me
            BETTER_AUTH_URL: https://inbox.adryan.me
            NEXT_PUBLIC_BYPASS_PREMIUM_CHECKS: "true"
            NEXT_PUBLIC_EMAIL_SEND_ENABLED: "true"
            NEXT_PUBLIC_AI_MODEL_SETTINGS_DISABLED: "true"
            # Google feature surfaces (scopes declared in GCP Data Access).
            NEXT_PUBLIC_CONTACTS_ENABLED: "true"
            NEXT_PUBLIC_MEETING_BRIEFS_ENABLED: "true"
            NEXT_PUBLIC_BOOKING_LINKS_ENABLED: "true"
            NEXT_PUBLIC_SMART_FILING_ENABLED: "true"
            NEXT_PUBLIC_DIGEST_ENABLED: "true"
            NEXT_PUBLIC_FOLLOW_UP_REMINDERS_ENABLED: "true"
            DEFAULT_LLMS: openrouter:deepseek/deepseek-v4-flash-latest
            ECONOMY_LLMS: openrouter:deepseek/deepseek-v4-flash-latest
            CHAT_LLMS: openrouter:deepseek/deepseek-v4-flash-latest
            NANO_LLMS: openrouter:deepseek/deepseek-v4-flash-latest
            DRAFT_LLMS: openrouter:deepseek/deepseek-v4-flash-latest
            QUEUE_BACKEND: bullmq
          # App + Redis + OpenRouter auth live in Vault (kv/inbox-zero/app). Chart skips its Secret.
          existingSecret: inbox-zero-secret
          secretEnv: {}
          # Upstream migrate Job is a pre-install hook that references SA inbox-zero,
          # but the ServiceAccount is not a hook — pods fail with SA not found.
          # Disable the hook; web runs Prisma migrations at startup instead.
          migrations:
            enabled: false
          postgresql:
            enabled: false
          externalDatabase:
            enabled: true
            existingSecret:
              name: inbox-zero-db
              databaseUrlKey: DATABASE_URL
              directUrlKey: DIRECT_URL
          redis:
            enabled: true
            persistence:
              enabled: true
              size: 2Gi
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
          redisHttp:
            enabled: true
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 128Mi
          worker:
            enabled: true
          cron:
            enabled: false
          web:
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi
    - repoURL: git@github.com:adryan30/infra.git
      targetRevision: HEAD
      path: workloads/inbox-zero

  destination:
    server: {{ include "workload.destinationServer" . }}
    namespace: inbox-zero

  # Chart omits StatefulSet defaults the API fills in (volumeMode, PVC retention,
  # updateStrategy, port protocol). Ignore so SSA does not report perpetual OutOfSync.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: inbox-zero-redis
      jqPathExpressions:
        - .spec.volumeClaimTemplates
        - .spec.persistentVolumeClaimRetentionPolicy
        - .spec.podManagementPolicy
        - .spec.revisionHistoryLimit
        - .spec.updateStrategy
        - .spec.template.spec.containers[].ports[].protocol

  info:
    - name: "Homepage:"
      value: "https://inbox.adryan.me"

  {{- include "workload.syncPolicy" (dict "profile" "workload") | nindent 2 }}
  revisionHistoryLimit: {{ include "workload.revisionHistoryLimit" . }}
{{- end }}

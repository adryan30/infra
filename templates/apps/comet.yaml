{{- if eq (include "workload.enabled" (dict "root" . "name" "comet")) "true" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: comet
  namespace: argocd
  finalizers:
    {{- include "workload.finalizers" . | nindent 4 }}
  labels:
    name: comet
spec:
  project: default
  source:
    repoURL: https://bjw-s-labs.github.io/helm-charts
    targetRevision: 4.6.2
    chart: app-template
    helm:
      valuesObject:
        controllers:
          main:
            strategy: RollingUpdate
            annotations:
              reloader.stakater.com/auto: "true"
            containers:
              main:
                image:
                  repository: g0ldyy/comet
                  tag: latest
                  pullPolicy: Always
                env:
                  DATABASE_TYPE: postgresql
                  PUBLIC_BASE_URL: https://comet.adryan.me
                  TZ: America/Bahia
                envFrom:
                  - secretRef:
                      name: comet-env
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /health
                        port: 8000
                      initialDelaySeconds: 15
                      periodSeconds: 30
                      timeoutSeconds: 5
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /health
                        port: 8000
                      initialDelaySeconds: 5
                      periodSeconds: 10
                      timeoutSeconds: 5
                resources:
                  requests:
                    cpu: 100m
                    memory: 512Mi
                  limits:
                    memory: 2Gi
        service:
          main:
            controller: main
            ports:
              http:
                port: 8000
        persistence:
          data:
            enabled: true
            type: persistentVolumeClaim
            accessMode: ReadWriteOnce
            size: 5Gi
            globalMounts:
              - path: /app/data

  destination:
    server: {{ include "workload.destinationServer" . }}
    namespace: comet

  info:
    - name: "Homepage:"
      value: "https://comet.adryan.me"

  {{- include "workload.syncPolicy" (dict "profile" "workload") | nindent 2 }}
  revisionHistoryLimit: {{ include "workload.revisionHistoryLimit" . }}
{{- end }}

{{- if eq (include "workload.enabled" (dict "root" . "name" "comet")) "true" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: comet
  namespace: argocd
  finalizers:
    {{- include "workload.finalizers" . | nindent 4 }}
  labels:
    name: comet
spec:
  project: default
  source:
    repoURL: https://bjw-s-labs.github.io/helm-charts
    targetRevision: 5.1.0
    chart: app-template
    helm:
      valuesObject:
        controllers:
          main:
            # Recreate: RWO PVC + CometNet identity keys must stay single-replica.
            strategy: Recreate
            annotations:
              reloader.stakater.com/auto: "true"
              # Keep total pod CPU request schedulable on packed nodes.
              sidecar.istio.io/proxyCPU: 10m
              sidecar.istio.io/proxyMemory: 128Mi
            containers:
              main:
                image:
                  repository: g0ldyy/comet
                  tag: latest
                  pullPolicy: Always
                env:
                  DATABASE_TYPE: postgresql
                  PUBLIC_BASE_URL: https://comet.adryan.me
                  TZ: America/Bahia
                  # CometNet integrated mode (single instance). Peers use FastAPI
                  # /cometnet/ws on the HTTP port via COMETNET_ADVERTISE_URL.
                  COMETNET_ENABLED: "True"
                  FASTAPI_WORKERS: "1"
                  COMETNET_ADVERTISE_URL: wss://comet.adryan.me/cometnet/ws
                  COMETNET_UPNP_ENABLED: "False"
                  # Self-check against the public mesh URL deadlocks lifespan:
                  # /health is not served until CometNet start finishes, but
                  # start waits for the public URL to answer.
                  COMETNET_SKIP_REACHABILITY_CHECK: "True"
                  # First boot hangs on large GitHub anime-mapping downloads inside
                  # lifespan (blocks /health). Re-enable after the app is stable.
                  ANIME_MAPPING_ENABLED: "False"
                envFrom:
                  - secretRef:
                      name: comet-env
                probes:
                  startup:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /health
                        port: 8000
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 60
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /health
                        port: 8000
                      periodSeconds: 30
                      timeoutSeconds: 5
                      failureThreshold: 3
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /health
                        port: 8000
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3
                resources:
                  requests:
                    cpu: 1m
                    memory: 512Mi
                  limits:
                    memory: 2Gi
        service:
          main:
            controller: main
            ports:
              http:
                port: 8000
        persistence:
          data:
            enabled: true
            type: persistentVolumeClaim
            accessMode: ReadWriteOnce
            size: 5Gi
            globalMounts:
              - path: /app/data

  destination:
    server: {{ include "workload.destinationServer" . }}
    namespace: comet

  info:
    - name: "Homepage:"
      value: "https://comet.adryan.me"

  {{- include "workload.syncPolicy" (dict "profile" "workload") | nindent 2 }}
  revisionHistoryLimit: {{ include "workload.revisionHistoryLimit" . }}
{{- end }}

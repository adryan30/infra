{{- if eq (include "workload.enabled" (dict "root" . "name" "monitoring")) "true" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    {{- include "workload.finalizers" . | nindent 4 }}
  labels:
    name: monitoring
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
    targetRevision: 88.5.3
    path: .
    helm:
      valuesObject:
        global:
          rbac:
            createAggregateClusterRoles: true
        # Chart 88+ CRDs exceed the 256Ki annotation limit for client-side
        # apply. Apply them via the chart's upgrade Job (server-side) instead
        # of rendering CRDs as plain Application resources.
        crds:
          upgradeJob:
            enabled: true
            forceConflicts: true
        prometheus:
          prometheusSpec:
            podMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false
            resources:
              requests:
                # 280m, sized from real p95 per ADR 0008: p95 over
                # Prometheus's own 10d retention (queried against itself)
                # was ~195m; 280m keeps ~1.4x margin, the standard
                # non-critical multiplier. Was 500m, unaudited since #116.
                cpu: 280m
            # Chart default is emptyDir -- every pod restart/reschedule wiped
            # all retention, resetting the p95 data #135 depends on to zero.
            # Found while recovering from the #132 incident: Prometheus was
            # down ~13h with no persisted history to fall back on. Longhorn,
            # matching monitoring-grafana's existing PVC below (no explicit
            # storageClassName, inherits the cluster default).
            #
            # 8Gi is a starting-point guess, not a measured size (can't
            # measure this cluster's own TSDB growth without persistent
            # storage existing first) -- retentionSize below caps usage at
            # 7GB, under the PVC, so hitting the ceiling degrades to
            # dropping oldest samples early rather than crash-looping on a
            # full disk (which would reproduce the #132 failure via disk
            # exhaustion instead of pod eviction). Revisit both once real
            # usage over a full 10d retention window is observable.
            retention: 10d
            retentionSize: 7GB
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 8Gi
        kube-state-metrics:
          resources:
            requests:
              cpu: 10m
        # shardblade-001 and shardblade-002 sit in separate OCI tenancies whose
        # VCNs both happen to use 10.0.0.0/24 -- the InternalIP the kubelet
        # Service normally scrapes is unroutable between them (colliding
        # CIDRs, confirmed via ARP: neither node can resolve the other's
        # InternalIP). Both nodes' ExternalIP is reachable and already the
        # peer address flannel's wireguard backend uses (flannel-external-ip:
        # true in the k3s config), so repoint the kubelet scrape there too.
        kubelet:
          serviceMonitor:
            cAdvisorRelabelings:
              - action: replace
                sourceLabels: [__metrics_path__]
                targetLabel: metrics_path
              - action: replace
                sourceLabels: [__meta_kubernetes_node_address_ExternalIP]
                regex: (.+)
                targetLabel: __address__
                replacement: "${1}:10250"
            probesRelabelings:
              - action: replace
                sourceLabels: [__metrics_path__]
                targetLabel: metrics_path
              - action: replace
                sourceLabels: [__meta_kubernetes_node_address_ExternalIP]
                regex: (.+)
                targetLabel: __address__
                replacement: "${1}:10250"
        nameOverride: monitoring
        fullnameOverride: monitoring
        grafana:
          resources:
            requests:
              cpu: 30m
          admin:
            existingSecret: monitoring-grafana-admin
            userKey: user
            passwordKey: password
          persistence:
            enabled: true
            accessModes:
              - ReadWriteOnce
            size: 5Gi

  destination:
    server: {{ include "workload.destinationServer" . }}
    namespace: monitoring

  ignoreDifferences:
    - kind: "ConfigMap"
      namespace: monitoring
      jsonPointers:
        - /data/grafana.ini

  {{- include "workload.syncPolicy" (dict "profile" "workload") | nindent 2 }}
  revisionHistoryLimit: {{ include "workload.revisionHistoryLimit" . }}
{{- end }}

{{- if eq (include "workload.enabled" (dict "root" . "name" "storyteller-watch")) "true" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storyteller-watch
  namespace: argocd
  finalizers:
    {{- include "workload.finalizers" . | nindent 4 }}
  labels:
    name: storyteller-watch
spec:
  project: default
  # Companion proxy for the Storyteller Garmin watch app
  # (github.com/adryan30/storyteller-garmin). The watch can't consume
  # Storyteller's API directly: /api/v2/books overflows the 512 KB audio-app
  # heap, OPDS uses a content type Connect IQ rejects, and Garmin can't play
  # Opus. This serves small paged JSON and transcodes audio to 64 kbps mono AAC.
  # Stateless apart from an ephemeral transcode cache; it forwards the
  # watch's Storyteller bearer token and holds no secrets.
  source:
    repoURL: https://bjw-s-labs.github.io/helm-charts
    targetRevision: 5.1.0
    chart: app-template
    helm:
      valuesObject:
        controllers:
          main:
            strategy: RollingUpdate
            annotations:
              reloader.stakater.com/auto: "true"
            containers:
              main:
                image:
                  repository: python
                  tag: 3.13-alpine3.22
                command:
                  - sh
                  - -c
                  - |
                    # Retry: the Istio sidecar may not be routing yet.
                    until apk add --no-cache ffmpeg; do sleep 3; done
                    exec python3 -u /app/server.py
                env:
                  STORYTELLER_URL: http://storyteller.books.svc.cluster.local:8001
                  CACHE_DIR: /cache
                  CACHE_MAX_MB: "3000"
                  PAGE_SIZE: "10"
                  AAC_BITRATE: 64k
                  AAC_CHANNELS: "1"
                  PORT: "8080"
                probes:
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /healthz
                        port: 8080
                      periodSeconds: 10
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /healthz
                        port: 8080
                      initialDelaySeconds: 120
                      periodSeconds: 30
                resources:
                  requests:
                    cpu: 1m
                    memory: 64Mi
                  limits:
                    memory: 512Mi
        service:
          main:
            controller: main
            ports:
              http:
                port: 8080
        configMaps:
          app:
            enabled: true
            data:
              server.py: |
                #!/usr/bin/env python3
                """Watch-facing proxy for Storyteller.

                Garmin watches only parse responses labelled application/json and can only
                play MP3 and AAC. Storyteller's compact listings (OPDS, readaloud manifests)
                use other JSON content types, its full book list is too large for the watch,
                and audio may be in any codec. This serves the few things the watch needs:

                  GET /watch/books?page=N         compact, paged list of books with audio
                  GET /watch/books/<id>/tracks    ordered audio parts of a book
                  GET /watch/books/<id>/audio/<n> part n as mono AAC (MP4); ?speed=1.5
                                                  speeds it up (0.5-2.0, pitch kept)

                The client's bearer token is forwarded to Storyteller; this holds no
                credentials of its own and never writes to Storyteller.
                """

                from __future__ import annotations

                import hashlib
                import json
                import os
                import posixpath
                import re
                import shutil
                import subprocess
                import threading
                import time
                import urllib.error
                import urllib.parse
                import urllib.request
                from concurrent.futures import ThreadPoolExecutor
                from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

                BACKEND = os.environ.get("STORYTELLER_URL", "http://storyteller.books.svc.cluster.local:8001").rstrip("/")
                CACHE_DIR = os.environ.get("CACHE_DIR", "/cache")
                CACHE_MAX_BYTES = int(os.environ.get("CACHE_MAX_MB", "3000")) * 1024 * 1024
                PAGE_SIZE = int(os.environ.get("PAGE_SIZE", "10"))
                AAC_BITRATE = os.environ.get("AAC_BITRATE", "64k")
                AAC_CHANNELS = os.environ.get("AAC_CHANNELS", "1")
                FFMPEG = os.environ.get("FFMPEG", "ffmpeg")
                PORT = int(os.environ.get("PORT", "8080"))

                _memo: dict[tuple, tuple[float, object]] = {}
                _memo_lock = threading.Lock()
                _prepare_locks: dict[str, threading.Lock] = {}
                _prepare_locks_lock = threading.Lock()


                class UpstreamError(Exception):
                    def __init__(self, status: int):
                        super().__init__(status)
                        self.status = status


                def fetch_json(path: str, token: str) -> object:
                    req = urllib.request.Request(BACKEND + path, headers={"Authorization": token, "Accept": "application/json"})
                    try:
                        with urllib.request.urlopen(req, timeout=60) as resp:
                            return json.load(resp)
                    except urllib.error.HTTPError as e:
                        raise UpstreamError(e.code) from None


                def memoized(key: tuple, ttl: float, compute):
                    now = time.monotonic()
                    with _memo_lock:
                        hit = _memo.get(key)
                        if hit and now - hit[0] < ttl:
                            return hit[1]
                    value = compute()
                    with _memo_lock:
                        _memo[key] = (now, value)
                    return value


                def first_name(people) -> str:
                    if isinstance(people, list) and people and isinstance(people[0], dict):
                        return people[0].get("name") or ""
                    return ""


                def audio_books(token: str) -> list[dict]:
                    def compute():
                        books = fetch_json("/api/v2/books", token)
                        result = []
                        for b in books if isinstance(books, list) else []:
                            audiobook = b.get("audiobook") or {}
                            readaloud = b.get("readaloud") or {}
                            has_audiobook = bool(audiobook) and not audiobook.get("missing")
                            has_readaloud = bool(readaloud) and not readaloud.get("missing") and readaloud.get("status") == "ALIGNED"
                            if has_audiobook or has_readaloud:
                                result.append({"id": b["uuid"], "title": b.get("title") or "Untitled", "author": first_name(b.get("authors"))})
                        result.sort(key=lambda b: b["title"].lower())
                        return result

                    return memoized(("books", token), 120, compute)


                def book_sources(book_id: str, token: str) -> list[dict]:
                    """Audio files of a book in playback order, as Storyteller paths."""

                    def compute():
                        base = f"/api/v2/books/{urllib.parse.quote(book_id)}"
                        try:
                            manifest = fetch_json(base + "/listen/manifest.json", token)
                            links = manifest.get("readingOrder") or []
                            return [
                                {"path": f"{base}/listen/{link['href']}", "title": link.get("title"), "duration": link.get("duration")}
                                for link in links
                                if link.get("href")
                            ]
                        except UpstreamError as e:
                            if e.status != 404:
                                raise
                        manifest = fetch_json(base + "/read/manifest.json", token)
                        hrefs = sorted(
                            r["href"]
                            for r in manifest.get("resources") or []
                            if r.get("href") and (r.get("type") or "").startswith("audio/")
                        )
                        try:
                            titles = readaloud_titles(base, manifest, token)
                        except (UpstreamError, OSError, ValueError) as e:
                            print(f"chapter titles for {book_id} unavailable: {e}", flush=True)
                            titles = {}
                        return [{"path": f"{base}/read/{href}", "title": titles.get(href), "duration": None} for href in hrefs]

                    return memoized(("sources", book_id, token), 6 * 3600, compute)


                def fetch_text(path: str, token: str) -> str:
                    req = urllib.request.Request(BACKEND + path, headers={"Authorization": token})
                    try:
                        with urllib.request.urlopen(req, timeout=60) as resp:
                            return resp.read().decode("utf-8", "replace")
                    except urllib.error.HTTPError as e:
                        raise UpstreamError(e.code) from None


                def readaloud_titles(base: str, manifest: dict, token: str) -> dict[str, str]:
                    """Names each readaloud audio file after the chapter it starts in.

                    Storyteller splits readaloud audio into numbered files unrelated to
                    chapters. Each chapter's media overlay (SMIL) lists the audio it plays,
                    and the table of contents names the chapters, so walking the reading
                    order gives every file the chapter where it first appears. Later files
                    within the same chapter get "(cont.)".
                    """
                    toc_titles: dict[str, str] = {}

                    def walk(entries):
                        for e in entries or []:
                            file = (e.get("href") or "").split("#")[0]
                            if file and e.get("title"):
                                toc_titles.setdefault(file, e["title"].strip())
                            walk(e.get("children"))

                    walk(manifest.get("toc"))

                    smil_hrefs = [
                        r["href"] for r in manifest.get("resources") or []
                        if r.get("href") and "smil" in (r.get("type") or "")
                    ]

                    def load(href: str) -> tuple[str | None, list[str]]:
                        text = fetch_text(f"{base}/read/{href}", token)
                        folder = posixpath.dirname(href)
                        textref = re.search(r'epub:textref="([^"#]+)', text)
                        audio: list[str] = []
                        for src in re.findall(r'<audio[^>]*\ssrc="([^"]+)"', text):
                            path = posixpath.normpath(posixpath.join(folder, src))
                            if not audio or audio[-1] != path:
                                audio.append(path)
                        textfile = posixpath.normpath(posixpath.join(folder, textref.group(1))) if textref else None
                        return textfile, audio

                    with ThreadPoolExecutor(max_workers=8) as pool:
                        overlays = dict(pool.map(load, smil_hrefs))

                    titles: dict[str, str] = {}
                    chapter = None
                    for item in manifest.get("readingOrder") or []:
                        file = (item.get("href") or "").split("#")[0]
                        chapter = toc_titles.get(file, chapter)
                        for audio in overlays.get(file) or []:
                            if audio not in titles and chapter:
                                titles[audio] = chapter

                    previous = None
                    for href in sorted(titles):
                        if titles[href] == previous:
                            titles[href] = previous + " (cont.)"
                        else:
                            previous = titles[href]
                    return titles




                def cache_path(source_path: str, speed: float) -> str:
                    key = f"{source_path}@{speed:g}"
                    return os.path.join(CACHE_DIR, hashlib.sha256(key.encode()).hexdigest()[:32])


                def prune_cache() -> None:
                    files = []
                    for name in os.listdir(CACHE_DIR):
                        p = os.path.join(CACHE_DIR, name)
                        if os.path.isfile(p) and not name.endswith((".tmp", ".src")):
                            st = os.stat(p)
                            files.append((st.st_atime, st.st_size, p))
                    total = sum(f[1] for f in files)
                    for _, size, p in sorted(files):
                        if total <= CACHE_MAX_BYTES:
                            break
                        os.remove(p)
                        total -= size


                def prepare(source_path: str, token: str, speed: float = 1.0) -> str:
                    """Produces a watch-playable file for a Storyteller audio path.

                    Every source (MP3, AAC, Opus, ...) is transcoded to a low-bitrate mono
                    AAC MP4 with the index up front: speech stays clear and books shrink to
                    a size the watch's 8 GB media storage and a Wi-Fi sync can handle.
                    """
                    dest = cache_path(source_path, speed)
                    with _prepare_locks_lock:
                        lock = _prepare_locks.setdefault(dest, threading.Lock())
                    with lock:
                        if os.path.exists(dest):
                            os.utime(dest)
                            return dest
                        src = dest + ".src"
                        tmp = dest + ".tmp"
                        try:
                            download(BACKEND + source_path, token, src)
                            subprocess.run(
                                [FFMPEG, "-v", "error", "-xerror", "-y", "-i", src,
                                 "-map", "0:a:0", "-vn", "-sn", "-dn",
                                 *(["-af", f"atempo={speed:g}"] if speed != 1.0 else []),
                                 "-c:a", "aac", "-b:a", AAC_BITRATE, "-ac", AAC_CHANNELS,
                                 "-movflags", "+faststart", "-f", "mp4", tmp],
                                check=True, timeout=3600,
                            )
                            os.replace(tmp, dest)
                        finally:
                            for p in (src, tmp):
                                if os.path.exists(p):
                                    os.remove(p)
                        prune_cache()
                        return dest


                def download(url: str, token: str, path: str, attempts: int = 5) -> None:
                    """Fetches url to path completely, resuming with Range after a dropped
                    connection. Storyteller connections can end early, and ffmpeg reading
                    over HTTP treats that as end of file and encodes a truncated track."""
                    total = None
                    with open(path, "wb") as f:
                        for attempt in range(attempts):
                            headers = {"Authorization": token}
                            if f.tell():
                                headers["Range"] = f"bytes={f.tell()}-"
                            try:
                                req = urllib.request.Request(url, headers=headers)
                                with urllib.request.urlopen(req, timeout=120) as resp:
                                    if total is None:
                                        total = int(resp.headers["Content-Length"]) if resp.headers["Content-Length"] else None
                                    if f.tell() and resp.status != 206:
                                        f.seek(0)
                                        f.truncate()
                                    shutil.copyfileobj(resp, f, 1024 * 1024)
                                if total is None or f.tell() >= total:
                                    return
                            except (urllib.error.URLError, OSError) as e:
                                print(f"download {url} attempt {attempt + 1}: {e}", flush=True)
                            time.sleep(2)
                    raise IOError(f"incomplete download of {url}: {os.path.getsize(path)} of {total} bytes")


                def prepare_in_background(source_path: str, token: str, speed: float = 1.0) -> None:
                    def run():
                        try:
                            prepare(source_path, token, speed)
                        except Exception as e:  # noqa: BLE001
                            print(f"prefetch failed for {source_path}: {e}", flush=True)

                    threading.Thread(target=run, daemon=True).start()


                def parse_speed(query: str) -> float:
                    try:
                        speed = float((urllib.parse.parse_qs(query).get("speed") or ["1"])[0])
                    except ValueError:
                        return 1.0
                    return round(min(2.0, max(0.5, speed)), 2)


                class Handler(BaseHTTPRequestHandler):
                    protocol_version = "HTTP/1.1"

                    def log_message(self, fmt, *args):
                        print(f"{self.address_string()} {fmt % args}", flush=True)

                    def send_json(self, status: int, body: object) -> None:
                        data = json.dumps(body, ensure_ascii=False).encode()
                        self.send_response(status)
                        self.send_header("Content-Type", "application/json")
                        self.send_header("Content-Length", str(len(data)))
                        self.end_headers()
                        self.wfile.write(data)

                    def do_GET(self):
                        url = urllib.parse.urlsplit(self.path)
                        if url.path == "/healthz":
                            return self.send_json(200, {"ok": True})
                        token = self.headers.get("Authorization")
                        if not token:
                            return self.send_json(401, {"error": "missing Authorization"})
                        try:
                            if url.path == "/watch/books":
                                return self.books(urllib.parse.parse_qs(url.query), token)
                            m = re.fullmatch(r"/watch/books/([^/]+)/tracks", url.path)
                            if m:
                                return self.tracks(m.group(1), token)
                            m = re.fullmatch(r"/watch/books/([^/]+)/audio/(\d+)", url.path)
                            if m:
                                return self.audio(m.group(1), int(m.group(2)), parse_speed(url.query), token)
                            return self.send_json(404, {"error": "not found"})
                        except UpstreamError as e:
                            return self.send_json(e.status, {"error": f"storyteller returned {e.status}"})
                        except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as e:
                            print(f"ffmpeg failed: {e}", flush=True)
                            return self.send_json(502, {"error": "audio conversion failed"})

                    def books(self, query: dict, token: str) -> None:
                        books = audio_books(token)
                        page = max(1, int((query.get("page") or ["1"])[0]))
                        start = (page - 1) * PAGE_SIZE
                        self.send_json(200, {
                            "books": books[start:start + PAGE_SIZE],
                            "page": page,
                            "next": start + PAGE_SIZE < len(books),
                            "total": len(books),
                        })

                    def tracks(self, book_id: str, token: str) -> None:
                        sources = book_sources(book_id, token)
                        tracks = []
                        for i, s in enumerate(sources):
                            duration = s.get("duration")
                            tracks.append({
                                "href": f"/watch/books/{book_id}/audio/{i}",
                                "title": s.get("title") or f"Part {i + 1}",
                                "type": "audio/mp4",
                                "duration": int(duration) if isinstance(duration, (int, float)) else 0,
                            })
                        if sources:
                            prepare_in_background(sources[0]["path"], token)
                        self.send_json(200, {"tracks": tracks})

                    def audio(self, book_id: str, index: int, speed: float, token: str) -> None:
                        sources = book_sources(book_id, token)
                        if index >= len(sources):
                            return self.send_json(404, {"error": "no such part"})
                        path = prepare(sources[index]["path"], token, speed)
                        if index + 1 < len(sources):
                            prepare_in_background(sources[index + 1]["path"], token, speed)
                        size = os.path.getsize(path)
                        self.send_response(200)
                        self.send_header("Content-Type", "audio/mp4")
                        self.send_header("Content-Length", str(size))
                        self.end_headers()
                        with open(path, "rb") as f:
                            shutil.copyfileobj(f, self.wfile, 1024 * 1024)


                if __name__ == "__main__":
                    os.makedirs(CACHE_DIR, exist_ok=True)
                    print(f"storyteller-watch on :{PORT} -> {BACKEND}", flush=True)
                    ThreadingHTTPServer(("", PORT), Handler).serve_forever()

        persistence:
          app:
            type: configMap
            identifier: app
            advancedMounts:
              main:
                main:
                  - path: /app/server.py
                    subPath: server.py
                    readOnly: true
          cache:
            type: emptyDir
            sizeLimit: 4Gi
            globalMounts:
              - path: /cache

  destination:
    server: {{ include "workload.destinationServer" . }}
    namespace: books

  {{- include "workload.syncPolicy" (dict "profile" "workload") | nindent 2 }}
  revisionHistoryLimit: {{ include "workload.revisionHistoryLimit" . }}
{{- end }}

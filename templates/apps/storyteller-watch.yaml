{{- if eq (include "workload.enabled" (dict "root" . "name" "storyteller-watch")) "true" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storyteller-watch
  namespace: argocd
  finalizers:
    {{- include "workload.finalizers" . | nindent 4 }}
  labels:
    name: storyteller-watch
spec:
  project: default
  # Companion proxy for the Storyteller Garmin watch app
  # (github.com/adryan30/storyteller-garmin). The watch can't consume
  # Storyteller's API directly: /api/v2/books overflows the 512 KB audio-app
  # heap, OPDS uses a content type Connect IQ rejects, and Garmin can't play
  # Opus. This serves small paged JSON and transcodes audio to 64 kbps mono AAC.
  # Stateless apart from an ephemeral transcode cache; it forwards the
  # watch's Storyteller bearer token and holds no secrets.
  source:
    repoURL: https://bjw-s-labs.github.io/helm-charts
    targetRevision: 5.2.1
    chart: app-template
    helm:
      valuesObject:
        controllers:
          main:
            strategy: RollingUpdate
            annotations:
              reloader.stakater.com/auto: "true"
            containers:
              main:
                image:
                  repository: python
                  tag: 3.13-alpine3.22
                command:
                  - sh
                  - -c
                  - |
                    # Retry: the Istio sidecar may not be routing yet.
                    until apk add --no-cache ffmpeg; do sleep 3; done
                    exec python3 -u /app/server.py
                env:
                  STORYTELLER_URL: http://storyteller.books.svc.cluster.local:8001
                  CACHE_DIR: /cache
                  CACHE_MAX_MB: "3000"
                  PAGE_SIZE: "10"
                  AAC_BITRATE: 64k
                  AAC_CHANNELS: "1"
                  PORT: "8080"
                probes:
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /healthz
                        port: 8080
                      periodSeconds: 10
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /healthz
                        port: 8080
                      initialDelaySeconds: 120
                      periodSeconds: 30
                resources:
                  requests:
                    cpu: 1m
                    memory: 64Mi
                  limits:
                    memory: 512Mi
        service:
          main:
            controller: main
            ports:
              http:
                port: 8080
        configMaps:
          app:
            enabled: true
            data:
              server.py: |
                #!/usr/bin/env python3
                """Watch-facing proxy for Storyteller.

                Garmin watches only parse responses labelled application/json and can only
                play MP3 and AAC. Storyteller's compact listings (OPDS, readaloud manifests)
                use other JSON content types, its full book list is too large for the watch,
                and audio may be in any codec. This serves the few things the watch needs:

                  GET /watch/books?page=N         compact, paged list of books with audio
                  GET /watch/books/<id>/tracks    ordered audio parts of a book
                  GET /watch/books/<id>/audio/<n> part n as mono AAC (MP4)

                The client's bearer token is forwarded to Storyteller; this holds no
                credentials of its own and never writes to Storyteller.
                """

                from __future__ import annotations

                import hashlib
                import json
                import os
                import re
                import shutil
                import subprocess
                import threading
                import time
                import urllib.error
                import urllib.parse
                import urllib.request
                from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

                BACKEND = os.environ.get("STORYTELLER_URL", "http://storyteller.books.svc.cluster.local:8001").rstrip("/")
                CACHE_DIR = os.environ.get("CACHE_DIR", "/cache")
                CACHE_MAX_BYTES = int(os.environ.get("CACHE_MAX_MB", "3000")) * 1024 * 1024
                PAGE_SIZE = int(os.environ.get("PAGE_SIZE", "10"))
                AAC_BITRATE = os.environ.get("AAC_BITRATE", "64k")
                AAC_CHANNELS = os.environ.get("AAC_CHANNELS", "1")
                FFMPEG = os.environ.get("FFMPEG", "ffmpeg")
                PORT = int(os.environ.get("PORT", "8080"))

                _memo: dict[tuple, tuple[float, object]] = {}
                _memo_lock = threading.Lock()
                _prepare_locks: dict[str, threading.Lock] = {}
                _prepare_locks_lock = threading.Lock()


                class UpstreamError(Exception):
                    def __init__(self, status: int):
                        super().__init__(status)
                        self.status = status


                def fetch_json(path: str, token: str) -> object:
                    req = urllib.request.Request(BACKEND + path, headers={"Authorization": token, "Accept": "application/json"})
                    try:
                        with urllib.request.urlopen(req, timeout=60) as resp:
                            return json.load(resp)
                    except urllib.error.HTTPError as e:
                        raise UpstreamError(e.code) from None


                def memoized(key: tuple, ttl: float, compute):
                    now = time.monotonic()
                    with _memo_lock:
                        hit = _memo.get(key)
                        if hit and now - hit[0] < ttl:
                            return hit[1]
                    value = compute()
                    with _memo_lock:
                        _memo[key] = (now, value)
                    return value


                def first_name(people) -> str:
                    if isinstance(people, list) and people and isinstance(people[0], dict):
                        return people[0].get("name") or ""
                    return ""


                def audio_books(token: str) -> list[dict]:
                    def compute():
                        books = fetch_json("/api/v2/books", token)
                        result = []
                        for b in books if isinstance(books, list) else []:
                            audiobook = b.get("audiobook") or {}
                            readaloud = b.get("readaloud") or {}
                            has_audiobook = bool(audiobook) and not audiobook.get("missing")
                            has_readaloud = bool(readaloud) and not readaloud.get("missing") and readaloud.get("status") == "ALIGNED"
                            if has_audiobook or has_readaloud:
                                result.append({"id": b["uuid"], "title": b.get("title") or "Untitled", "author": first_name(b.get("authors"))})
                        result.sort(key=lambda b: b["title"].lower())
                        return result

                    return memoized(("books", token), 120, compute)


                def book_sources(book_id: str, token: str) -> list[dict]:
                    """Audio files of a book in playback order, as Storyteller paths."""

                    def compute():
                        base = f"/api/v2/books/{urllib.parse.quote(book_id)}"
                        try:
                            manifest = fetch_json(base + "/listen/manifest.json", token)
                            links = manifest.get("readingOrder") or []
                            return [
                                {"path": f"{base}/listen/{link['href']}", "title": link.get("title"), "duration": link.get("duration")}
                                for link in links
                                if link.get("href")
                            ]
                        except UpstreamError as e:
                            if e.status != 404:
                                raise
                        manifest = fetch_json(base + "/read/manifest.json", token)
                        hrefs = sorted(
                            r["href"]
                            for r in manifest.get("resources") or []
                            if r.get("href") and (r.get("type") or "").startswith("audio/")
                        )
                        return [{"path": f"{base}/read/{href}", "title": None, "duration": None} for href in hrefs]

                    return memoized(("sources", book_id, token), 600, compute)




                def cache_path(source_path: str) -> str:
                    return os.path.join(CACHE_DIR, hashlib.sha256(source_path.encode()).hexdigest()[:32])


                def prune_cache() -> None:
                    files = []
                    for name in os.listdir(CACHE_DIR):
                        p = os.path.join(CACHE_DIR, name)
                        if os.path.isfile(p) and not name.endswith(".tmp"):
                            st = os.stat(p)
                            files.append((st.st_atime, st.st_size, p))
                    total = sum(f[1] for f in files)
                    for _, size, p in sorted(files):
                        if total <= CACHE_MAX_BYTES:
                            break
                        os.remove(p)
                        total -= size


                def prepare(source_path: str, token: str) -> str:
                    """Produces a watch-playable file for a Storyteller audio path.

                    Every source (MP3, AAC, Opus, ...) is transcoded to a low-bitrate mono
                    AAC MP4 with the index up front: speech stays clear and books shrink to
                    a size the watch's 8 GB media storage and a Wi-Fi sync can handle.
                    """
                    dest = cache_path(source_path)
                    with _prepare_locks_lock:
                        lock = _prepare_locks.setdefault(dest, threading.Lock())
                    with lock:
                        if os.path.exists(dest):
                            os.utime(dest)
                            return dest
                        url = BACKEND + source_path
                        tmp = dest + ".tmp"
                        subprocess.run(
                            [FFMPEG, "-v", "error", "-y", "-headers", f"Authorization: {token}\r\n", "-i", url,
                             "-map", "0:a:0", "-vn", "-sn", "-dn",
                             "-c:a", "aac", "-b:a", AAC_BITRATE, "-ac", AAC_CHANNELS,
                             "-movflags", "+faststart", "-f", "mp4", tmp],
                            check=True, timeout=3600,
                        )
                        os.replace(tmp, dest)
                        prune_cache()
                        return dest


                def prepare_in_background(source_path: str, token: str) -> None:
                    def run():
                        try:
                            prepare(source_path, token)
                        except Exception as e:  # noqa: BLE001
                            print(f"prefetch failed for {source_path}: {e}", flush=True)

                    threading.Thread(target=run, daemon=True).start()


                class Handler(BaseHTTPRequestHandler):
                    protocol_version = "HTTP/1.1"

                    def log_message(self, fmt, *args):
                        print(f"{self.address_string()} {fmt % args}", flush=True)

                    def send_json(self, status: int, body: object) -> None:
                        data = json.dumps(body, ensure_ascii=False).encode()
                        self.send_response(status)
                        self.send_header("Content-Type", "application/json")
                        self.send_header("Content-Length", str(len(data)))
                        self.end_headers()
                        self.wfile.write(data)

                    def do_GET(self):
                        url = urllib.parse.urlsplit(self.path)
                        if url.path == "/healthz":
                            return self.send_json(200, {"ok": True})
                        token = self.headers.get("Authorization")
                        if not token:
                            return self.send_json(401, {"error": "missing Authorization"})
                        try:
                            if url.path == "/watch/books":
                                return self.books(urllib.parse.parse_qs(url.query), token)
                            m = re.fullmatch(r"/watch/books/([^/]+)/tracks", url.path)
                            if m:
                                return self.tracks(m.group(1), token)
                            m = re.fullmatch(r"/watch/books/([^/]+)/audio/(\d+)", url.path)
                            if m:
                                return self.audio(m.group(1), int(m.group(2)), token)
                            return self.send_json(404, {"error": "not found"})
                        except UpstreamError as e:
                            return self.send_json(e.status, {"error": f"storyteller returned {e.status}"})
                        except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as e:
                            print(f"ffmpeg failed: {e}", flush=True)
                            return self.send_json(502, {"error": "audio conversion failed"})

                    def books(self, query: dict, token: str) -> None:
                        books = audio_books(token)
                        page = max(1, int((query.get("page") or ["1"])[0]))
                        start = (page - 1) * PAGE_SIZE
                        self.send_json(200, {
                            "books": books[start:start + PAGE_SIZE],
                            "page": page,
                            "next": start + PAGE_SIZE < len(books),
                            "total": len(books),
                        })

                    def tracks(self, book_id: str, token: str) -> None:
                        sources = book_sources(book_id, token)
                        tracks = []
                        for i, s in enumerate(sources):
                            duration = s.get("duration")
                            tracks.append({
                                "href": f"/watch/books/{book_id}/audio/{i}",
                                "title": s.get("title") or f"Part {i + 1}",
                                "type": "audio/mp4",
                                "duration": int(duration) if isinstance(duration, (int, float)) else 0,
                            })
                        if sources:
                            prepare_in_background(sources[0]["path"], token)
                        self.send_json(200, {"tracks": tracks})

                    def audio(self, book_id: str, index: int, token: str) -> None:
                        sources = book_sources(book_id, token)
                        if index >= len(sources):
                            return self.send_json(404, {"error": "no such part"})
                        path = prepare(sources[index]["path"], token)
                        if index + 1 < len(sources):
                            prepare_in_background(sources[index + 1]["path"], token)
                        size = os.path.getsize(path)
                        self.send_response(200)
                        self.send_header("Content-Type", "audio/mp4")
                        self.send_header("Content-Length", str(size))
                        self.end_headers()
                        with open(path, "rb") as f:
                            shutil.copyfileobj(f, self.wfile, 1024 * 1024)


                if __name__ == "__main__":
                    os.makedirs(CACHE_DIR, exist_ok=True)
                    print(f"storyteller-watch on :{PORT} -> {BACKEND}", flush=True)
                    ThreadingHTTPServer(("", PORT), Handler).serve_forever()
        persistence:
          app:
            type: configMap
            identifier: app
            advancedMounts:
              main:
                main:
                  - path: /app/server.py
                    subPath: server.py
                    readOnly: true
          cache:
            type: emptyDir
            sizeLimit: 4Gi
            globalMounts:
              - path: /cache

  destination:
    server: {{ include "workload.destinationServer" . }}
    namespace: books

  {{- include "workload.syncPolicy" (dict "profile" "workload") | nindent 2 }}
  revisionHistoryLimit: {{ include "workload.revisionHistoryLimit" . }}
{{- end }}

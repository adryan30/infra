{{- if eq (include "workload.enabled" (dict "root" . "name" "storyteller-watch")) "true" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storyteller-watch
  namespace: argocd
  finalizers:
    {{- include "workload.finalizers" . | nindent 4 }}
  labels:
    name: storyteller-watch
spec:
  project: default
  # Companion proxy for the Storyteller Garmin watch app
  # (github.com/adryan30/storyteller-garmin). The watch can't consume
  # Storyteller's API directly: /api/v2/books overflows the 512 KB audio-app
  # heap, OPDS uses a content type Connect IQ rejects, and Garmin can't play
  # Opus. This serves small paged JSON and transcodes audio to 64 kbps mono AAC.
  # Stateless apart from an ephemeral transcode cache; it forwards the
  # watch's Storyteller bearer token and holds no secrets. Its only write to
  # Storyteller is the user's reading position (POST /api/v2/books/<id>/positions).
  source:
    repoURL: https://bjw-s-labs.github.io/helm-charts
    targetRevision: 5.1.0
    chart: app-template
    helm:
      valuesObject:
        controllers:
          main:
            strategy: RollingUpdate
            annotations:
              reloader.stakater.com/auto: "true"
            containers:
              main:
                image:
                  repository: python
                  tag: 3.13-alpine3.22
                command:
                  - sh
                  - -c
                  - |
                    # Retry: the Istio sidecar may not be routing yet.
                    until apk add --no-cache ffmpeg; do sleep 3; done
                    exec python3 -u /app/server.py
                env:
                  STORYTELLER_URL: http://storyteller.books.svc.cluster.local:8001
                  CACHE_DIR: /cache
                  CACHE_MAX_MB: "3000"
                  PAGE_SIZE: "10"
                  AAC_BITRATE: 64k
                  AAC_CHANNELS: "1"
                  PORT: "8080"
                probes:
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /healthz
                        port: 8080
                      periodSeconds: 10
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /healthz
                        port: 8080
                      initialDelaySeconds: 120
                      periodSeconds: 30
                resources:
                  requests:
                    cpu: 1m
                    memory: 64Mi
                  limits:
                    memory: 512Mi
        service:
          main:
            controller: main
            ports:
              http:
                port: 8080
        configMaps:
          app:
            enabled: true
            data:
              server.py: |
                #!/usr/bin/env python3
                """Watch-facing proxy for Storyteller.

                Garmin watches only parse responses labelled application/json and can only
                play MP3 and AAC. Storyteller's compact listings (OPDS, readaloud manifests)
                use other JSON content types, its full book list is too large for the watch,
                and audio may be in any codec. This serves the few things the watch needs:

                  GET  /watch/books?page=N            compact, paged list of books with audio,
                                                      currently-reading books first
                  GET  /watch/books/<id>/tracks       ordered audio parts with chapter titles
                                                      and durations
                  GET  /watch/books/<id>/audio/<n>    part n as mono AAC (MP4); ?speed=1.5
                                                      speeds it up (0.5-2.0, pitch kept)
                  GET  /watch/books/<id>/prepare      converts the whole book in the
                                                      background (?from=<n>&speed=)
                  POST /watch/books/<id>/position     reconciles the watch's position with
                                                      Storyteller's; the newer one wins

                The client's bearer token is forwarded to Storyteller; this holds no
                credentials of its own. Its only write to Storyteller is the reading
                position, through the same API the Storyteller apps use.
                """

                from __future__ import annotations

                import hashlib
                import json
                import os
                import posixpath
                import re
                import shutil
                import subprocess
                import threading
                import time
                import urllib.error
                import urllib.parse
                import urllib.request
                from concurrent.futures import ThreadPoolExecutor
                from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

                BACKEND = os.environ.get("STORYTELLER_URL", "http://storyteller.books.svc.cluster.local:8001").rstrip("/")
                CACHE_DIR = os.environ.get("CACHE_DIR", "/cache")
                CACHE_MAX_BYTES = int(os.environ.get("CACHE_MAX_MB", "3000")) * 1024 * 1024
                PAGE_SIZE = int(os.environ.get("PAGE_SIZE", "10"))
                AAC_BITRATE = os.environ.get("AAC_BITRATE", "64k")
                AAC_CHANNELS = os.environ.get("AAC_CHANNELS", "1")
                FFMPEG = os.environ.get("FFMPEG", "ffmpeg")
                PORT = int(os.environ.get("PORT", "8080"))

                _memo: dict[tuple, tuple[float, object]] = {}
                _memo_lock = threading.Lock()
                _prepare_locks: dict[str, threading.Lock] = {}
                _prepare_locks_lock = threading.Lock()


                class UpstreamError(Exception):
                    def __init__(self, status: int):
                        super().__init__(status)
                        self.status = status


                def fetch_json(path: str, token: str) -> object:
                    req = urllib.request.Request(BACKEND + path, headers={"Authorization": token, "Accept": "application/json"})
                    try:
                        with urllib.request.urlopen(req, timeout=60) as resp:
                            return json.load(resp)
                    except urllib.error.HTTPError as e:
                        raise UpstreamError(e.code) from None


                def memoized(key: tuple, ttl: float, compute):
                    now = time.monotonic()
                    with _memo_lock:
                        hit = _memo.get(key)
                        if hit and now - hit[0] < ttl:
                            return hit[1]
                    value = compute()
                    with _memo_lock:
                        _memo[key] = (now, value)
                    return value


                STATUS_ORDER = {"Reading": 0, "To read": 1, "Read": 2}


                def first_name(people) -> str:
                    if isinstance(people, list) and people and isinstance(people[0], dict):
                        return people[0].get("name") or ""
                    return ""


                def audio_books(token: str) -> list[dict]:
                    def compute():
                        books = fetch_json("/api/v2/books", token)
                        result = []
                        for b in books if isinstance(books, list) else []:
                            audiobook = b.get("audiobook") or {}
                            readaloud = b.get("readaloud") or {}
                            has_audiobook = bool(audiobook) and not audiobook.get("missing")
                            has_readaloud = bool(readaloud) and not readaloud.get("missing") and readaloud.get("status") == "ALIGNED"
                            if has_audiobook or has_readaloud:
                                status = (b.get("status") or {}).get("name") or ""
                                position = b.get("position") or {}
                                result.append({
                                    "id": b["uuid"],
                                    "title": b.get("title") or "Untitled",
                                    "author": first_name(b.get("authors")),
                                    "status": status,
                                    "_rank": STATUS_ORDER.get(status, 1),
                                    "_touched": position.get("timestamp") or 0,
                                })
                        # Reading first (most recently read first), then To read, then Read.
                        result.sort(key=lambda b: (b["_rank"], -b["_touched"], b["title"].lower()))
                        for b in result:
                            del b["_rank"], b["_touched"]
                        return result

                    return memoized(("books", token), 120, compute)


                def book_info(book_id: str, token: str) -> dict:
                    """Audio files of a book in playback order, plus the readaloud timeline.

                    sources: [{path, title, duration}] as Storyteller paths.
                    timeline: for readalouds, the sentence-level text/audio sync used for
                    positions; None for plain audiobooks.
                    """

                    def compute():
                        base = f"/api/v2/books/{urllib.parse.quote(book_id)}"
                        try:
                            manifest = fetch_json(base + "/listen/manifest.json", token)
                            links = manifest.get("readingOrder") or []
                            sources = [
                                {"path": f"{base}/listen/{link['href']}", "title": link.get("title"), "duration": link.get("duration")}
                                for link in links
                                if link.get("href")
                            ]
                            return {"sources": sources, "timeline": None}
                        except UpstreamError as e:
                            if e.status != 404:
                                raise
                        manifest = fetch_json(base + "/read/manifest.json", token)
                        hrefs = sorted(
                            r["href"]
                            for r in manifest.get("resources") or []
                            if r.get("href") and (r.get("type") or "").startswith("audio/")
                        )
                        try:
                            timeline = Timeline(base, manifest, hrefs, token)
                        except (UpstreamError, OSError, ValueError) as e:
                            print(f"readaloud timeline for {book_id} unavailable: {e}", flush=True)
                            timeline = None
                        sources = [
                            {
                                "path": f"{base}/read/{href}",
                                "title": timeline.titles.get(href) if timeline else None,
                                "duration": timeline.durations[i] if timeline else None,
                            }
                            for i, href in enumerate(hrefs)
                        ]
                        return {"sources": sources, "timeline": timeline}

                    return memoized(("book", book_id, token), 6 * 3600, compute)


                def book_sources(book_id: str, token: str) -> list[dict]:
                    return book_info(book_id, token)["sources"]


                def fetch_text(path: str, token: str) -> str:
                    req = urllib.request.Request(BACKEND + path, headers={"Authorization": token})
                    try:
                        with urllib.request.urlopen(req, timeout=60) as resp:
                            return resp.read().decode("utf-8", "replace")
                    except urllib.error.HTTPError as e:
                        raise UpstreamError(e.code) from None


                def clock(value: str) -> float:
                    """SMIL clock value ("31.39s", "1:02.5", "0:01:02.5") in seconds."""
                    value = value.strip()
                    if value.endswith("ms"):
                        return float(value[:-2]) / 1000
                    if value.endswith("s"):
                        return float(value[:-1])
                    seconds = 0.0
                    for part in value.split(":"):
                        seconds = seconds * 60 + float(part)
                    return seconds


                class Timeline:
                    """Sentence-level sync between a readaloud's text and its audio files.

                    Storyteller splits readaloud audio into numbered files unrelated to
                    chapters. Each chapter's media overlay (SMIL) pairs every sentence
                    (xhtml file + fragment id) with an audio clip, and the table of contents
                    names the chapters. From those this derives chapter titles per audio
                    file, file durations, and conversions between (file, seconds) and
                    Storyteller's Readium locators.
                    """

                    def __init__(self, base: str, manifest: dict, hrefs: list[str], token: str):
                        index = {href: i for i, href in enumerate(hrefs)}
                        toc_titles: dict[str, str] = {}

                        def walk(entries):
                            for e in entries or []:
                                file = (e.get("href") or "").split("#")[0]
                                if file and e.get("title"):
                                    toc_titles.setdefault(file, e["title"].strip())
                                walk(e.get("children"))

                        walk(manifest.get("toc"))

                        smil_hrefs = [
                            r["href"] for r in manifest.get("resources") or []
                            if r.get("href") and "smil" in (r.get("type") or "")
                        ]

                        def load(href: str) -> tuple[str | None, list[tuple]]:
                            text = fetch_text(f"{base}/read/{href}", token)
                            folder = posixpath.dirname(href)
                            textref = re.search(r'epub:textref="([^"#]+)', text)
                            pars = []
                            for par in re.findall(r"<par\b.*?</par>", text, flags=re.S):
                                t = re.search(r'<text[^>]*\ssrc="([^"]+)"', par)
                                a = re.search(r'<audio[^>]*\ssrc="([^"]+)"', par)
                                if not t or not a:
                                    continue
                                file, _, frag = t.group(1).partition("#")
                                audio = posixpath.normpath(posixpath.join(folder, a.group(1)))
                                if audio not in index:
                                    continue
                                b = re.search(r'clipBegin="([^"]+)"', par)
                                e = re.search(r'clipEnd="([^"]+)"', par)
                                pars.append((
                                    posixpath.normpath(posixpath.join(folder, file)), frag, index[audio],
                                    clock(b.group(1)) if b else 0.0, clock(e.group(1)) if e else 0.0,
                                ))
                            textfile = posixpath.normpath(posixpath.join(folder, textref.group(1))) if textref else None
                            return textfile, pars

                        with ThreadPoolExecutor(max_workers=8) as pool:
                            overlays = dict(pool.map(load, smil_hrefs))

                        self.reading_order = [(item.get("href") or "").split("#")[0] for item in manifest.get("readingOrder") or []]
                        self.pars: list[tuple] = []  # (xhtml, fragment, audio index, begin, end)
                        self.titles: dict[str, str] = {}
                        chapter = None
                        for file in self.reading_order:
                            chapter = toc_titles.get(file, chapter)
                            for par in overlays.get(file) or []:
                                self.pars.append(par)
                                href = hrefs[par[2]]
                                if href not in self.titles and chapter:
                                    self.titles[href] = chapter
                        previous = None
                        for href in hrefs:
                            title = self.titles.get(href)
                            if title is None:
                                continue
                            if title == previous:
                                self.titles[href] = title + " (cont.)"
                            else:
                                previous = title

                        self.durations = [0.0] * len(hrefs)
                        for par in self.pars:
                            self.durations[par[2]] = max(self.durations[par[2]], par[4])
                        self.starts = [0.0] * len(hrefs)
                        for i in range(1, len(hrefs)):
                            self.starts[i] = self.starts[i - 1] + self.durations[i - 1]
                        self.total = sum(self.durations) or 1.0
                        self.by_fragment = {(p[0], p[1]): i for i, p in enumerate(self.pars)}
                        self.by_file: dict[str, list[int]] = {}
                        for i, p in enumerate(self.pars):
                            self.by_file.setdefault(p[0], []).append(i)

                    def to_locator(self, track: int, seconds: float) -> dict | None:
                        candidates = [i for i, p in enumerate(self.pars) if p[2] == track]
                        if not candidates:
                            candidates = [i for i, p in enumerate(self.pars) if p[2] < track][-1:]
                        if not candidates:
                            return None
                        chosen = candidates[0]
                        for i in candidates:
                            if self.pars[i][3] <= seconds:
                                chosen = i
                        xhtml, frag, _, _, _ = self.pars[chosen]
                        in_file = self.by_file[xhtml]
                        return {
                            "href": xhtml,
                            "type": "application/xhtml+xml",
                            "locations": {
                                "fragments": [frag],
                                "progression": in_file.index(chosen) / len(in_file),
                                "totalProgression": min(1.0, (self.starts[track] + seconds) / self.total),
                            },
                        }

                    def from_locator(self, locator: dict) -> tuple[int, float]:
                        href = (locator.get("href") or "").split("#")[0].lstrip("/")
                        locations = locator.get("locations") or {}
                        frags = locations.get("fragments") or []
                        for frag in frags:
                            i = self.by_fragment.get((href, frag))
                            if i is not None:
                                return self.pars[i][2], self.pars[i][3]
                        if href in self.by_file:
                            i = self.by_file[href][0]
                            return self.pars[i][2], self.pars[i][3]
                        if href in self.reading_order:
                            later = self.reading_order[self.reading_order.index(href):]
                            for file in later:
                                if file in self.by_file:
                                    i = self.by_file[file][0]
                                    return self.pars[i][2], self.pars[i][3]
                        target = float(locations.get("totalProgression") or 0) * self.total
                        for track in range(len(self.starts) - 1, -1, -1):
                            if self.starts[track] <= target:
                                return track, target - self.starts[track]
                        return 0, 0.0


                def cache_path(source_path: str, speed: float) -> str:
                    key = f"{source_path}@{speed:g}"
                    return os.path.join(CACHE_DIR, hashlib.sha256(key.encode()).hexdigest()[:32])


                def prune_cache() -> None:
                    files = []
                    for name in os.listdir(CACHE_DIR):
                        p = os.path.join(CACHE_DIR, name)
                        if os.path.isfile(p) and not name.endswith((".tmp", ".src")):
                            st = os.stat(p)
                            files.append((st.st_atime, st.st_size, p))
                    total = sum(f[1] for f in files)
                    for _, size, p in sorted(files):
                        if total <= CACHE_MAX_BYTES:
                            break
                        os.remove(p)
                        total -= size


                def prepare(source_path: str, token: str, speed: float = 1.0) -> str:
                    """Produces a watch-playable file for a Storyteller audio path.

                    Every source (MP3, AAC, Opus, ...) is transcoded to a low-bitrate mono
                    AAC MP4 with the index up front: speech stays clear and books shrink to
                    a size the watch's 8 GB media storage and a Wi-Fi sync can handle.
                    """
                    dest = cache_path(source_path, speed)
                    with _prepare_locks_lock:
                        lock = _prepare_locks.setdefault(dest, threading.Lock())
                    with lock:
                        if os.path.exists(dest):
                            os.utime(dest)
                            return dest
                        src = dest + ".src"
                        tmp = dest + ".tmp"
                        try:
                            download(BACKEND + source_path, token, src)
                            subprocess.run(
                                [FFMPEG, "-v", "error", "-xerror", "-y", "-i", src,
                                 "-map", "0:a:0", "-vn", "-sn", "-dn",
                                 *(["-af", f"atempo={speed:g}"] if speed != 1.0 else []),
                                 "-c:a", "aac", "-b:a", AAC_BITRATE, "-ac", AAC_CHANNELS,
                                 "-movflags", "+faststart", "-f", "mp4", tmp],
                                check=True, timeout=3600,
                            )
                            os.replace(tmp, dest)
                        finally:
                            for p in (src, tmp):
                                if os.path.exists(p):
                                    os.remove(p)
                        prune_cache()
                        return dest


                def download(url: str, token: str, path: str, attempts: int = 5) -> None:
                    """Fetches url to path completely, resuming with Range after a dropped
                    connection. Storyteller connections can end early, and ffmpeg reading
                    over HTTP treats that as end of file and encodes a truncated track."""
                    total = None
                    with open(path, "wb") as f:
                        for attempt in range(attempts):
                            headers = {"Authorization": token}
                            if f.tell():
                                headers["Range"] = f"bytes={f.tell()}-"
                            try:
                                req = urllib.request.Request(url, headers=headers)
                                with urllib.request.urlopen(req, timeout=120) as resp:
                                    if total is None:
                                        total = int(resp.headers["Content-Length"]) if resp.headers["Content-Length"] else None
                                    if f.tell() and resp.status != 206:
                                        f.seek(0)
                                        f.truncate()
                                    shutil.copyfileobj(resp, f, 1024 * 1024)
                                if total is None or f.tell() >= total:
                                    return
                            except (urllib.error.URLError, OSError) as e:
                                print(f"download {url} attempt {attempt + 1}: {e}", flush=True)
                            time.sleep(2)
                    raise IOError(f"incomplete download of {url}: {os.path.getsize(path)} of {total} bytes")


                def prepare_in_background(source_path: str, token: str, speed: float = 1.0) -> None:
                    def run():
                        try:
                            prepare(source_path, token, speed)
                        except Exception as e:  # noqa: BLE001
                            print(f"prefetch failed for {source_path}: {e}", flush=True)

                    threading.Thread(target=run, daemon=True).start()


                def parse_speed(query: str) -> float:
                    try:
                        speed = float((urllib.parse.parse_qs(query).get("speed") or ["1"])[0])
                    except ValueError:
                        return 1.0
                    return round(min(2.0, max(0.5, speed)), 2)


                def post_json(path: str, body: object, token: str) -> int:
                    data = json.dumps(body).encode()
                    req = urllib.request.Request(BACKEND + path, data=data, method="POST", headers={
                        "Authorization": token, "Content-Type": "application/json",
                    })
                    try:
                        with urllib.request.urlopen(req, timeout=60) as resp:
                            return resp.status
                    except urllib.error.HTTPError as e:
                        if e.code == 409:
                            return 409
                        raise UpstreamError(e.code) from None


                def server_position(book_id: str, token: str) -> dict | None:
                    try:
                        position = fetch_json(f"/api/v2/books/{urllib.parse.quote(book_id)}/positions", token)
                    except UpstreamError as e:
                        if e.status == 404:
                            return None
                        raise
                    return position if isinstance(position, dict) and position.get("locator") else None


                def sync_position(book_id: str, watch: dict, token: str) -> dict:
                    """Reconciles the watch's position with Storyteller's; the newer wins.

                    watch: {track, seconds (at 1x), timestamp (unix seconds, 0 if never set)}.
                    Returns {source: "server", track, seconds, timestamp} when the watch
                    should adopt Storyteller's position, otherwise {source: "watch"|"same"}.
                    """
                    timeline = book_info(book_id, token)["timeline"]
                    if timeline is None:
                        return {"source": "unsupported"}
                    watch_ts = int(watch.get("timestamp") or 0)
                    for _ in range(2):
                        server = server_position(book_id, token)
                        server_ts = int(server["timestamp"]) // 1000 if server else 0
                        if server and server_ts > watch_ts:
                            track, seconds = timeline.from_locator(server["locator"])
                            return {"source": "server", "track": track, "seconds": int(seconds), "timestamp": server_ts}
                        if watch_ts == 0 or watch_ts == server_ts:
                            return {"source": "same"}
                        locator = timeline.to_locator(int(watch.get("track") or 0), float(watch.get("seconds") or 0))
                        if locator is None:
                            return {"source": "same"}
                        status = post_json(f"/api/v2/books/{urllib.parse.quote(book_id)}/positions",
                                           {"locator": locator, "timestamp": watch_ts * 1000}, token)
                        if status != 409:
                            return {"source": "watch"}
                    return {"source": "same"}


                _book_workers: set[tuple] = set()
                _book_workers_lock = threading.Lock()
                _book_slots = threading.Semaphore(2)


                def prepare_book(book_id: str, start: int, speed: float, token: str) -> None:
                    """Converts a whole book in the background, starting at track start, so
                    the watch's sync mostly downloads files that are already prepared."""
                    key = (book_id, speed)
                    with _book_workers_lock:
                        if key in _book_workers:
                            return
                        _book_workers.add(key)

                    def run():
                        try:
                            with _book_slots:
                                sources = book_sources(book_id, token)
                                order = list(range(start, len(sources))) + list(range(0, min(start, len(sources))))
                                for i in order:
                                    prepare(sources[i]["path"], token, speed)
                        except Exception as e:  # noqa: BLE001
                            print(f"preparing {book_id} failed: {e}", flush=True)
                        finally:
                            with _book_workers_lock:
                                _book_workers.discard(key)

                    threading.Thread(target=run, daemon=True).start()


                class Handler(BaseHTTPRequestHandler):
                    protocol_version = "HTTP/1.1"

                    def log_message(self, fmt, *args):
                        print(f"{self.address_string()} {fmt % args}", flush=True)

                    def send_json(self, status: int, body: object) -> None:
                        data = json.dumps(body, ensure_ascii=False).encode()
                        self.send_response(status)
                        self.send_header("Content-Type", "application/json")
                        self.send_header("Content-Length", str(len(data)))
                        self.end_headers()
                        self.wfile.write(data)

                    def do_GET(self):
                        url = urllib.parse.urlsplit(self.path)
                        if url.path == "/healthz":
                            return self.send_json(200, {"ok": True})
                        token = self.headers.get("Authorization")
                        if not token:
                            return self.send_json(401, {"error": "missing Authorization"})
                        try:
                            if url.path == "/watch/books":
                                return self.books(urllib.parse.parse_qs(url.query), token)
                            m = re.fullmatch(r"/watch/books/([^/]+)/tracks", url.path)
                            if m:
                                return self.tracks(m.group(1), token)
                            m = re.fullmatch(r"/watch/books/([^/]+)/prepare", url.path)
                            if m:
                                query = urllib.parse.parse_qs(url.query)
                                start = int((query.get("from") or ["0"])[0])
                                prepare_book(m.group(1), max(0, start), parse_speed(url.query), token)
                                return self.send_json(200, {"ok": True})
                            m = re.fullmatch(r"/watch/books/([^/]+)/audio/(\d+)", url.path)
                            if m:
                                return self.audio(m.group(1), int(m.group(2)), parse_speed(url.query), token)
                            return self.send_json(404, {"error": "not found"})
                        except UpstreamError as e:
                            return self.send_json(e.status, {"error": f"storyteller returned {e.status}"})
                        except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as e:
                            print(f"ffmpeg failed: {e}", flush=True)
                            return self.send_json(502, {"error": "audio conversion failed"})

                    def do_POST(self):
                        url = urllib.parse.urlsplit(self.path)
                        token = self.headers.get("Authorization")
                        if not token:
                            return self.send_json(401, {"error": "missing Authorization"})
                        try:
                            length = int(self.headers.get("Content-Length") or 0)
                            body = json.loads(self.rfile.read(length) or b"{}")
                            m = re.fullmatch(r"/watch/books/([^/]+)/position", url.path)
                            if m and isinstance(body, dict):
                                return self.send_json(200, sync_position(m.group(1), body, token))
                            return self.send_json(404, {"error": "not found"})
                        except UpstreamError as e:
                            return self.send_json(e.status, {"error": f"storyteller returned {e.status}"})
                        except ValueError:
                            return self.send_json(400, {"error": "invalid body"})

                    def books(self, query: dict, token: str) -> None:
                        books = audio_books(token)
                        page = max(1, int((query.get("page") or ["1"])[0]))
                        start = (page - 1) * PAGE_SIZE
                        self.send_json(200, {
                            "books": books[start:start + PAGE_SIZE],
                            "page": page,
                            "next": start + PAGE_SIZE < len(books),
                            "total": len(books),
                        })

                    def tracks(self, book_id: str, token: str) -> None:
                        sources = book_sources(book_id, token)
                        tracks = []
                        for i, s in enumerate(sources):
                            duration = s.get("duration")
                            tracks.append({
                                "href": f"/watch/books/{book_id}/audio/{i}",
                                "title": s.get("title") or f"Part {i + 1}",
                                "type": "audio/mp4",
                                "duration": int(duration) if isinstance(duration, (int, float)) else 0,
                            })
                        self.send_json(200, {"tracks": tracks})

                    def audio(self, book_id: str, index: int, speed: float, token: str) -> None:
                        sources = book_sources(book_id, token)
                        if index >= len(sources):
                            return self.send_json(404, {"error": "no such part"})
                        path = prepare(sources[index]["path"], token, speed)
                        if index + 1 < len(sources):
                            prepare_in_background(sources[index + 1]["path"], token, speed)
                        size = os.path.getsize(path)
                        self.send_response(200)
                        self.send_header("Content-Type", "audio/mp4")
                        self.send_header("Content-Length", str(size))
                        self.end_headers()
                        with open(path, "rb") as f:
                            shutil.copyfileobj(f, self.wfile, 1024 * 1024)


                if __name__ == "__main__":
                    os.makedirs(CACHE_DIR, exist_ok=True)
                    print(f"storyteller-watch on :{PORT} -> {BACKEND}", flush=True)
                    ThreadingHTTPServer(("", PORT), Handler).serve_forever()

        persistence:
          app:
            type: configMap
            identifier: app
            advancedMounts:
              main:
                main:
                  - path: /app/server.py
                    subPath: server.py
                    readOnly: true
          cache:
            type: emptyDir
            sizeLimit: 4Gi
            globalMounts:
              - path: /cache

  destination:
    server: {{ include "workload.destinationServer" . }}
    namespace: books

  {{- include "workload.syncPolicy" (dict "profile" "workload") | nindent 2 }}
  revisionHistoryLimit: {{ include "workload.revisionHistoryLimit" . }}
{{- end }}

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    name: istio-gateway
    app: istio
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: gateway
    targetRevision: 1.30.3
    helm:
      valuesObject:
        replicaCount: 2
        # No nodeSelector (#136): previously pinned to shardblade-001 so the
        # gateway would land same-node as LiveKit's hostNetwork pod (see
        # templates/apps/stoat.yaml) -- a pod can't route to another node's
        # raw host IP, confirmed live. Dropping the pin is a known interim
        # tradeoff, decided regardless of #137 (removing Stoat/LiveKit)'s
        # timing: templates/istio/virtualservices/stoat.yaml routes the
        # public /livekit prefix through this gateway to
        # stoat-livekit.stoat.svc.cluster.local, so a gateway replica the
        # scheduler places on shardblade-002 will fail to reach it until
        # #137 lands. Revisit if that turns out to bite before #137 ships.
        # 30m, sized from real p95 per ADR 0008: quantile_over_time(0.95,
        # rate(container_cpu_usage_seconds_total{...istio-proxy...}[5m])
        # [10d:5m]) against Prometheus returned ~6m -- 30m keeps 5x margin
        # (public ingress edge, so more generous than the standard
        # 1.3-1.5x). Was 100m (chart default, top of the 50-100m range
        # decided in #136) while no p95 history existed yet; the HPA
        # targets 80% CPU-of-request, and 30m still leaves ~4x room over
        # the observed peak before that threshold, so this shouldn't
        # reintroduce the #136 flap.
        resources:
          requests:
            cpu: 30m
            memory: 128Mi
          limits:
            cpu: "2"
            memory: 1Gi
        service:
          ports:
            - name: status-port
              port: 15021
              protocol: TCP
              targetPort: 15021
            - name: http2
              port: 80
              protocol: TCP
              targetPort: 80
            - name: https
              port: 443
              protocol: TCP
              targetPort: 443

  destination:
    server: https://kubernetes.default.svc
    namespace: istio-ingress

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3

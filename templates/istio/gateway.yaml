apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    name: istio-gateway
    app: istio
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: gateway
    targetRevision: 1.30.4
    helm:
      valuesObject:
        replicaCount: 2
        # No nodeSelector (#136): previously pinned to shardblade-001 so the
        # gateway would land same-node as LiveKit's hostNetwork pod (see
        # templates/apps/stoat.yaml) -- a pod can't route to another node's
        # raw host IP, confirmed live. Dropping the pin is a known interim
        # tradeoff, decided regardless of #137 (removing Stoat/LiveKit)'s
        # timing: templates/istio/virtualservices/stoat.yaml routes the
        # public /livekit prefix through this gateway to
        # stoat-livekit.stoat.svc.cluster.local, so a gateway replica the
        # scheduler places on shardblade-002 will fail to reach it until
        # #137 lands. Revisit if that turns out to bite before #137 ships.
        # 100m (chart default, top of the 50-100m range decided in #136):
        # the HPA targets 80% CPU-of-request, so a too-small request makes
        # any real usage blip read as a huge percentage and flap replicas
        # between 1 and 2. No Prometheus p95 history exists yet to size this
        # via ADR 0008 (the retention window doesn't cover this component
        # yet) -- revisit with real p95 data once it does.
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "2"
            memory: 1Gi
        service:
          ports:
            - name: status-port
              port: 15021
              protocol: TCP
              targetPort: 15021
            - name: http2
              port: 80
              protocol: TCP
              targetPort: 80
            - name: https
              port: 443
              protocol: TCP
              targetPort: 443

  destination:
    server: https://kubernetes.default.svc
    namespace: istio-ingress

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3

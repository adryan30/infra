apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    name: istio
    app: istio
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    targetRevision: 1.30.3
    helm:
      valuesObject:
        # 40m (#132): the chart's 100m default x every mesh-injected pod
        # (63 istio-proxy sidecars cluster-wide) was the actual dominant
        # driver of both nodes sitting at 97-98% CPU-request commitment --
        # bigger than any single platform component's own request (#116).
        # Confirmed live via `kubectl top pods --containers`: real usage
        # tops out at 25m (longhorn's instance-manager sidecar, the
        # busiest one observed), most sidecars sit at 2-10m. 40m keeps
        # ~60% margin over that observed peak. This is a point-in-time
        # snapshot, not a full p95 per ADR 0008 (Prometheus itself was
        # down when this landed, see #135) -- revisit with real sidecar
        # p95 once retention accumulates.
        global:
          proxy:
            resources:
              requests:
                cpu: 40m
        pilot:
          # istiod itself (the "discovery" container) was left on the
          # istiod chart's own 500m default -- never audited by #116/ADR
          # 0008, which focused on platform Applications and the
          # mesh-wide sidecar default above, not istiod's own control
          # plane. `kubectl top` shows ~7-10m actual usage steady-state.
          # 75m keeps ~7-10x margin (wider than the 1.3-1.5x standard --
          # istiod pushes xDS config to every sidecar cluster-wide, so
          # starving it under a big reconfig burst has a bigger blast
          # radius than a single component). Point-in-time, not full p95
          # (same limitation noted below for the gateway) -- revisit once
          # Prometheus has a clean istiod series to query.
          resources:
            requests:
              cpu: 75m
          cni:
            enabled: true
        platform: k3s
        meshConfig:
          extensionProviders:
            - name: oauth2-proxy
              envoyExtAuthzHttp:
                service: oauth2-proxy.keycloak.svc.cluster.local
                port: 4180
                headersToDownstreamOnDeny:
                  - content-type
                  - set-cookie
                headersToUpstreamOnAllow:
                  - authorization
                  - path
                  - x-auth-request-user
                  - x-auth-request-email
                  - x-auth-request-access-token
                includeHeadersInCheck:
                  - "authorization"
                  - "cookie"
                  - "x-forwarded-access-token"
                  - "x-forwarded-user"
                  - "x-forwarded-email"
                  - "x-forwarded-proto"
                  - "proxy-authorization"
                  - "user-agent"
                  - "x-forwarded-host"
                  - "from"
                  - "x-forwarded-for"
                  - "accept"
                  - "x-auth-request-redirect"
                includeHeadersInResponse:
                  - "authorization"
                  - "set-cookie"
                  - "x-auth-user"
          defaultConfig:
            terminationDrainDuration: 310s

  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system

  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.failurePolicy

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3

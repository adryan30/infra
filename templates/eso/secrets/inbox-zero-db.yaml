{{- if eq (include "workload.enabled" (dict "root" . "name" "inbox-zero")) "true" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: inbox-zero-db
  namespace: inbox-zero
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: inbox-zero-db
    template:
      engineVersion: v2
      data:
        # Prisma defaults to public; Sphere also owns an inboxzero schema for the role.
        DATABASE_URL: "{{ `{{ .uri }}` }}?schema=public"
        DIRECT_URL: "{{ `{{ .uri }}` }}?schema=public"
  data:
    - secretKey: uri
      remoteRef:
        key: storage/sphere-inboxzero
        property: uri
{{- end }}

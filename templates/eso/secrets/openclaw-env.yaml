{{- if eq (include "workload.enabled" (dict "root" . "name" "openclaw")) "true" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-env
  namespace: openclaw
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: openclaw-env
  data:
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: openclaw/app
        property: OPENROUTER_API_KEY
{{- end }}

# Vault kv path stoat/app must provide (crypto material ESO's generic Password
# generator can't safely produce, since it isn't byte-length/format exact):
#   VAPID_PRIVATE_KEY, VAPID_PUBLIC_KEY — EC P-256 keypair for web push.
#     Generate with `npx web-push generate-vapid-keys`.
#   FILES_ENCRYPTION_KEY — 32 raw bytes, base64-encoded, for file-at-rest AES.
#     Generate with `openssl rand -base64 32`.
#
# Everything else here is an override on top of the binary's baked-in default
# Revolt.toml (stoatchat/stoatchat crates/core/config/Revolt.toml, loaded first,
# then deep-merged with whatever this renders to /Revolt.toml) — mirrors how
# upstream's own generate_config.sh only ever appends a handful of keys rather
# than writing a complete file. Fields left unset here (redis host, rabbit
# host/port/username, minio endpoint/default_bucket) rely on the baked-in
# defaults resolving correctly because the redis/rabbit/minio Services in
# templates/apps/stoat.yaml are deliberately named to match upstream's
# docker-compose service names (redis, rabbit, minio).
{{- if eq (include "workload.enabled" (dict "root" . "name" "stoat")) "true" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stoat-config
  namespace: stoat
spec:
  # Generate once, never refresh. This mixes Vault-sourced fields (VAPID keys,
  # encryption key) with non-deterministic Password-generator pulls (Rabbit/
  # MinIO/LiveKit creds) — a periodic refresh regenerates fresh random values
  # every interval, and RabbitMQ/MinIO only pick up their password at their
  # own container startup, so every later interval mismatches whatever they
  # were actually started with (ACCESS_REFUSED, found live while babysitting
  # the rollout). Same reasoning as teamspeak-query.yaml and the
  # stoat-mongo-*-user ExternalSecrets, which already used "0" correctly —
  # this file was the one inconsistent with that pattern.
  refreshInterval: "0"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: stoat-config
    template:
      engineVersion: v2
      data:
        Revolt.toml: |
          [database]
          # Percona-operator-managed replica set (templates/storage/stoat-mongo.yaml),
          # cross-namespace. size:1 replset -> single pod DNS name; update this if the
          # replset is ever scaled up to a real multi-member set.
          mongodb = "mongodb://revolt:{{ `{{ .MONGO_APP_PASSWORD | urlquery }}` }}@stoat-rs0-0.stoat-rs0.storage.svc.cluster.local:27017/revolt?replicaSet=rs0&authSource=revolt"

          [hosts]
          app = "https://stoat.adryan.me"
          api = "https://stoat.adryan.me/api"
          events = "wss://stoat.adryan.me/ws"
          autumn = "https://stoat.adryan.me/autumn"
          january = "https://stoat.adryan.me/january"

          [hosts.livekit]
          worldwide = "wss://stoat.adryan.me/livekit"

          [rabbit]
          password = "{{ `{{ .RABBIT_PASSWORD }}` }}"

          [api.livekit.nodes.worldwide]
          # Direct internal Service address, not the public domain — matches
          # upstream's own migrations/20260218-voice-config.sh exactly
          # (url = "http://livekit:7880" for their docker-compose service
          # name). This is the server-internal Twirp/RoomService API base the
          # Rust livekit-api crate's RoomClient uses for calls like CreateRoom
          # — routing it through Istio's Envoy (as https://stoat.adryan.me/
          # livekit) either broke on scheme (wss:// initially) or, once fixed
          # to https://, corrupted the Twirp/protobuf payload in transit
          # (`invalid wire type: EndGroup` decode error on join_call, found
          # live). Talking to the Service directly sidesteps the mesh proxy
          # for this internal server-to-server call entirely, same as
          # upstream. The client-facing WebSocket URL is the separate
          # [hosts.livekit] entry below, wss://stoat.adryan.me/livekit is
          # correct and unrelated to this field.
          url = "http://stoat-livekit:7880"
          lat = 0.0
          lon = 0.0
          key = "{{ `{{ .LIVEKIT_KEY }}` }}"
          secret = "{{ `{{ .LIVEKIT_SECRET }}` }}"

          [pushd.vapid]
          private_key = "{{ `{{ .VAPID_PRIVATE_KEY }}` }}"
          public_key = "{{ `{{ .VAPID_PUBLIC_KEY }}` }}"

          [files]
          encryption_key = "{{ `{{ .FILES_ENCRYPTION_KEY }}` }}"

          [files.s3]
          access_key_id = "{{ `{{ .MINIO_ROOT_USER }}` }}"
          secret_access_key = "{{ `{{ .MINIO_ROOT_PASSWORD }}` }}"
        livekit.yml: |
          port: 7880
          rtc:
            tcp_port: 7881
            port_range_start: 50000
            port_range_end: 50100
            use_external_ip: false
            # Same node-pinned public IP teamspeak.yaml already established for this
            # cluster's UDP LoadBalancer path (shardblade-001, grey-cloud origin).
            node_ip: 144.22.177.60
          redis:
            address: redis:6379
          keys:
            # Quoted: general-passgen's symbol charset (~!#^&*()_+) includes
            # several YAML-special leading characters (comment/anchor/alias/tag
            # markers) that break an unquoted scalar.
            "{{ `{{ .LIVEKIT_KEY }}` }}": "{{ `{{ .LIVEKIT_SECRET }}` }}"
          webhook:
            api_key: "{{ `{{ .LIVEKIT_KEY }}` }}"
            # voice-ingress's route is POST /<node>, where <node> must match the
            # key used for both [hosts.livekit] and [api.livekit.nodes] in
            # Revolt.toml ("worldwide" here) — confirmed against
            # stoatchat/stoatchat crates/daemons/voice-ingress/src/api.rs.
            # /webhook was a guess and 404'd.
            urls:
              - http://stoat-voiceingress:8500/worldwide
        HOSTNAME: "stoat.adryan.me"
        REVOLT_PUBLIC_URL: "https://stoat.adryan.me"
        VITE_API_URL: "https://stoat.adryan.me/api"
        VITE_WS_URL: "wss://stoat.adryan.me/ws"
        VITE_MEDIA_URL: "https://stoat.adryan.me/autumn"
        VITE_PROXY_URL: "https://stoat.adryan.me/january"
        VITE_GIFBOX_URL: "https://stoat.adryan.me/gifbox"
        VITE_CFG_ENABLE_VIDEO: "true"
        # Flat keys for the minio/rabbitmq controllers and autumn's
        # init-buckets container in templates/apps/stoat.yaml, which reference
        # these via secretKeyRef directly rather than parsing them out of
        # Revolt.toml — the same generated values, just also exposed as their
        # own keys instead of only embedded in the TOML text above.
        MINIO_ROOT_USER: "{{ `{{ .MINIO_ROOT_USER }}` }}"
        MINIO_ROOT_PASSWORD: "{{ `{{ .MINIO_ROOT_PASSWORD }}` }}"
        RABBIT_PASSWORD: "{{ `{{ .RABBIT_PASSWORD }}` }}"
  data:
    - secretKey: VAPID_PRIVATE_KEY
      remoteRef:
        key: stoat/app
        property: VAPID_PRIVATE_KEY
    - secretKey: VAPID_PUBLIC_KEY
      remoteRef:
        key: stoat/app
        property: VAPID_PUBLIC_KEY
    - secretKey: FILES_ENCRYPTION_KEY
      remoteRef:
        key: stoat/app
        property: FILES_ENCRYPTION_KEY
    - secretKey: MONGO_APP_PASSWORD
      remoteRef:
        key: storage/stoat-mongo-app-user
        property: password
    # Generated once by templates/storage/stoat-generated-secrets.yaml, not
    # here directly — see that file's header comment for why. This
    # ExternalSecret only ever reads the already-fixed value; it never
    # invokes the password generator itself, so editing this file (e.g. the
    # LiveKit webhook URL) can't regenerate live credentials out from under
    # RabbitMQ/MinIO again.
    - secretKey: RABBIT_PASSWORD
      remoteRef:
        key: storage/stoat-generated
        property: RABBIT_PASSWORD
    - secretKey: MINIO_ROOT_USER
      remoteRef:
        key: storage/stoat-generated
        property: MINIO_ROOT_USER
    - secretKey: MINIO_ROOT_PASSWORD
      remoteRef:
        key: storage/stoat-generated
        property: MINIO_ROOT_PASSWORD
    - secretKey: LIVEKIT_KEY
      remoteRef:
        key: storage/stoat-generated
        property: LIVEKIT_KEY
    - secretKey: LIVEKIT_SECRET
      remoteRef:
        key: storage/stoat-generated
        property: LIVEKIT_SECRET
{{- end }}

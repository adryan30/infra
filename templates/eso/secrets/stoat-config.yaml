# Vault kv path stoat/app must provide (crypto material ESO's generic Password
# generator can't safely produce, since it isn't byte-length/format exact):
#   VAPID_PRIVATE_KEY, VAPID_PUBLIC_KEY — EC P-256 keypair for web push.
#     Generate with `npx web-push generate-vapid-keys`.
#   FILES_ENCRYPTION_KEY — 32 raw bytes, base64-encoded, for file-at-rest AES.
#     Generate with `openssl rand -base64 32`.
#
# Everything else here is an override on top of the binary's baked-in default
# Revolt.toml (stoatchat/stoatchat crates/core/config/Revolt.toml, loaded first,
# then deep-merged with whatever this renders to /Revolt.toml) — mirrors how
# upstream's own generate_config.sh only ever appends a handful of keys rather
# than writing a complete file. Fields left unset here (redis host, rabbit
# host/port/username, minio endpoint/default_bucket) rely on the baked-in
# defaults resolving correctly because the redis/rabbit/minio Services in
# templates/apps/stoat.yaml are deliberately named to match upstream's
# docker-compose service names (redis, rabbit, minio).
{{- if eq (include "workload.enabled" (dict "root" . "name" "stoat")) "true" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stoat-config
  namespace: stoat
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: stoat-config
    template:
      engineVersion: v2
      data:
        Revolt.toml: |
          [database]
          # Percona-operator-managed replica set (templates/storage/stoat-mongo.yaml),
          # cross-namespace. size:1 replset -> single pod DNS name; update this if the
          # replset is ever scaled up to a real multi-member set.
          mongodb = "mongodb://revolt:{{ `{{ .MONGO_APP_PASSWORD | urlquery }}` }}@stoat-rs0-0.stoat-rs0.storage.svc.cluster.local:27017/revolt?replicaSet=rs0&authSource=revolt"

          [hosts]
          app = "https://stoat.adryan.me"
          api = "https://stoat.adryan.me/api"
          events = "wss://stoat.adryan.me/ws"
          autumn = "https://stoat.adryan.me/autumn"
          january = "https://stoat.adryan.me/january"

          [hosts.livekit]
          worldwide = "wss://stoat.adryan.me/livekit"

          [rabbit]
          password = "{{ `{{ .RABBIT_PASSWORD }}` }}"

          [api.livekit.nodes.worldwide]
          url = "wss://stoat.adryan.me/livekit"
          lat = 0.0
          lon = 0.0
          key = "{{ `{{ .LIVEKIT_KEY }}` }}"
          secret = "{{ `{{ .LIVEKIT_SECRET }}` }}"

          [pushd.vapid]
          private_key = "{{ `{{ .VAPID_PRIVATE_KEY }}` }}"
          public_key = "{{ `{{ .VAPID_PUBLIC_KEY }}` }}"

          [files]
          encryption_key = "{{ `{{ .FILES_ENCRYPTION_KEY }}` }}"

          [files.s3]
          access_key_id = "{{ `{{ .MINIO_ROOT_USER }}` }}"
          secret_access_key = "{{ `{{ .MINIO_ROOT_PASSWORD }}` }}"
        livekit.yml: |
          port: 7880
          rtc:
            tcp_port: 7881
            port_range_start: 50000
            port_range_end: 50100
            use_external_ip: false
            # Same node-pinned public IP teamspeak.yaml already established for this
            # cluster's UDP LoadBalancer path (shardblade-001, grey-cloud origin).
            node_ip: 144.22.177.60
          redis:
            address: redis:6379
          keys:
            # Quoted: general-passgen's symbol charset (~!#^&*()_+) includes
            # several YAML-special leading characters (comment/anchor/alias/tag
            # markers) that break an unquoted scalar.
            "{{ `{{ .LIVEKIT_KEY }}` }}": "{{ `{{ .LIVEKIT_SECRET }}` }}"
          webhook:
            api_key: "{{ `{{ .LIVEKIT_KEY }}` }}"
            # Confirm this path/port against voice-ingress's actual webhook route on
            # first deploy (not documented upstream) — see plan's "open implementation
            # risk" note.
            urls:
              - http://stoat-voiceingress:8500/webhook
        HOSTNAME: "stoat.adryan.me"
        REVOLT_PUBLIC_URL: "https://stoat.adryan.me"
        VITE_API_URL: "https://stoat.adryan.me/api"
        VITE_WS_URL: "wss://stoat.adryan.me/ws"
        VITE_MEDIA_URL: "https://stoat.adryan.me/autumn"
        VITE_PROXY_URL: "https://stoat.adryan.me/january"
        VITE_GIFBOX_URL: "https://stoat.adryan.me/gifbox"
        VITE_CFG_ENABLE_VIDEO: "true"
  data:
    - secretKey: VAPID_PRIVATE_KEY
      remoteRef:
        key: stoat/app
        property: VAPID_PRIVATE_KEY
    - secretKey: VAPID_PUBLIC_KEY
      remoteRef:
        key: stoat/app
        property: VAPID_PUBLIC_KEY
    - secretKey: FILES_ENCRYPTION_KEY
      remoteRef:
        key: stoat/app
        property: FILES_ENCRYPTION_KEY
    - secretKey: MONGO_APP_PASSWORD
      remoteRef:
        key: storage/stoat-mongo-app-user
        property: password
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: "general-passgen"
      rewrite:
        - regexp:
            source: "password"
            target: "RABBIT_PASSWORD"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: "general-passgen"
      rewrite:
        - regexp:
            source: "password"
            target: "MINIO_ROOT_USER"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: "general-passgen"
      rewrite:
        - regexp:
            source: "password"
            target: "MINIO_ROOT_PASSWORD"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: "general-passgen"
      rewrite:
        - regexp:
            source: "password"
            target: "LIVEKIT_KEY"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: "general-passgen"
      rewrite:
        - regexp:
            source: "password"
            target: "LIVEKIT_SECRET"
{{- end }}

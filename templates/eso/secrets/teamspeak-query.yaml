{{- if eq (include "workload.enabled" (dict "root" . "name" "teamspeak")) "true" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: teamspeak-env
  namespace: teamspeak
spec:
  # Generate once; rotating the query admin password would kick operators.
  refreshInterval: "0"
  target:
    name: teamspeak-env
    template:
      data:
        TSSERVER_QUERY_ADMIN_PASSWORD: "{{ `{{ .password }}` }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: "general-passgen"
{{- end }}

{{- if eq (include "workload.enabled" (dict "root" . "name" "netbird")) "true" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-idp
  namespace: netbird
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: netbird-idp
  data:
    - secretKey: clientId
      remoteRef:
        key: netbird/keycloak-backend
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: netbird/keycloak-backend
        property: clientSecret
{{- end }}

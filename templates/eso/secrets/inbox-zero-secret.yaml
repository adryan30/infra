{{- if eq (include "workload.enabled" (dict "root" . "name" "inbox-zero")) "true" }}
# Vault kv path inbox-zero/app must provide (generate with openssl rand -hex as noted):
#   AUTH_SECRET, EMAIL_ENCRYPT_SECRET (32 hex), EMAIL_ENCRYPT_SALT (16 hex),
#   INTERNAL_API_KEY, API_KEY_SALT, CRON_SECRET,
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_PUBSUB_TOPIC_NAME,
#   GOOGLE_PUBSUB_VERIFICATION_TOKEN,
#   OPENROUTER_API_KEY (LLM via openrouter:deepseek/deepseek-v4-flash-latest),
#   AUTH_ALLOWED_EMAILS (comma-separated),
#   REDIS_PASSWORD, UPSTASH_REDIS_TOKEN
# REDIS_URL / UPSTASH_REDIS_URL are derived here for chart Redis + HTTP bridge
# (extractable later to a shared Redis platform without changing app keys).
# Gmail OAuth/Pub/Sub use GOOGLE_CLIENT_* / GOOGLE_PUBSUB_* — not a Gemini API key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: inbox-zero-secret
  namespace: inbox-zero
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: inbox-zero-secret
    template:
      engineVersion: v2
      data:
        AUTH_SECRET: "{{ `{{ .AUTH_SECRET }}` }}"
        EMAIL_ENCRYPT_SECRET: "{{ `{{ .EMAIL_ENCRYPT_SECRET }}` }}"
        EMAIL_ENCRYPT_SALT: "{{ `{{ .EMAIL_ENCRYPT_SALT }}` }}"
        INTERNAL_API_KEY: "{{ `{{ .INTERNAL_API_KEY }}` }}"
        API_KEY_SALT: "{{ `{{ .API_KEY_SALT }}` }}"
        CRON_SECRET: "{{ `{{ .CRON_SECRET }}` }}"
        GOOGLE_CLIENT_ID: "{{ `{{ .GOOGLE_CLIENT_ID }}` }}"
        GOOGLE_CLIENT_SECRET: "{{ `{{ .GOOGLE_CLIENT_SECRET }}` }}"
        GOOGLE_PUBSUB_TOPIC_NAME: "{{ `{{ .GOOGLE_PUBSUB_TOPIC_NAME }}` }}"
        GOOGLE_PUBSUB_VERIFICATION_TOKEN: "{{ `{{ .GOOGLE_PUBSUB_VERIFICATION_TOKEN }}` }}"
        OPENROUTER_API_KEY: "{{ `{{ .OPENROUTER_API_KEY }}` }}"
        AUTH_ALLOWED_EMAILS: "{{ `{{ .AUTH_ALLOWED_EMAILS }}` }}"
        REDIS_PASSWORD: "{{ `{{ .REDIS_PASSWORD }}` }}"
        UPSTASH_REDIS_TOKEN: "{{ `{{ .UPSTASH_REDIS_TOKEN }}` }}"
        REDIS_URL: "redis://:{{ `{{ .REDIS_PASSWORD | urlquery }}` }}@inbox-zero-redis:6379"
        UPSTASH_REDIS_URL: "http://inbox-zero-redis-http:80"
  data:
    - secretKey: AUTH_SECRET
      remoteRef:
        key: inbox-zero/app
        property: AUTH_SECRET
    - secretKey: EMAIL_ENCRYPT_SECRET
      remoteRef:
        key: inbox-zero/app
        property: EMAIL_ENCRYPT_SECRET
    - secretKey: EMAIL_ENCRYPT_SALT
      remoteRef:
        key: inbox-zero/app
        property: EMAIL_ENCRYPT_SALT
    - secretKey: INTERNAL_API_KEY
      remoteRef:
        key: inbox-zero/app
        property: INTERNAL_API_KEY
    - secretKey: API_KEY_SALT
      remoteRef:
        key: inbox-zero/app
        property: API_KEY_SALT
    - secretKey: CRON_SECRET
      remoteRef:
        key: inbox-zero/app
        property: CRON_SECRET
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: inbox-zero/app
        property: GOOGLE_CLIENT_ID
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: inbox-zero/app
        property: GOOGLE_CLIENT_SECRET
    - secretKey: GOOGLE_PUBSUB_TOPIC_NAME
      remoteRef:
        key: inbox-zero/app
        property: GOOGLE_PUBSUB_TOPIC_NAME
    - secretKey: GOOGLE_PUBSUB_VERIFICATION_TOKEN
      remoteRef:
        key: inbox-zero/app
        property: GOOGLE_PUBSUB_VERIFICATION_TOKEN
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: inbox-zero/app
        property: OPENROUTER_API_KEY
    - secretKey: AUTH_ALLOWED_EMAILS
      remoteRef:
        key: inbox-zero/app
        property: AUTH_ALLOWED_EMAILS
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: inbox-zero/app
        property: REDIS_PASSWORD
    - secretKey: UPSTASH_REDIS_TOKEN
      remoteRef:
        key: inbox-zero/app
        property: UPSTASH_REDIS_TOKEN
{{- end }}

{{- if eq (include "workload.enabled" (dict "root" . "name" "securo")) "true" }}
# Vault kv path securo/app must provide:
#   SECRET_KEY (openssl rand -hex 32), AGENTS_MCP_JWT_SECRET (openssl rand -hex 32,
#   used by the built-in MCP server to mint short-lived JWTs for tool calls),
#   OIDC_CLIENT_ID, OIDC_CLIENT_SECRET (Keycloak client "securo" in realm master,
#   redirect URI https://finance.adryan.me/api/auth/oidc/callback),
#   PLUGGY_CLIENT_ID, PLUGGY_CLIENT_SECRET (pluggy.ai — leave "" until real
#   creds exist; a non-empty dummy would make the app try to call Pluggy's
#   API and fail loudly, empty is the chart's own documented "off" state).
# The AI provider connection itself (OpenRouter etc.) is NOT env-driven —
# it's a DB-backed row configured via Settings -> AI Agents in the app, so
# it isn't in this Secret at all.
# Chart only takes one global.existingSecret name (envFrom, backend + migration Job),
# so DB + app secrets are combined into one Secret here (comet-env.yaml shape, not
# inbox-zero's two-secret split).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: securo-secrets
  namespace: securo
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: securo-secrets
    template:
      engineVersion: v2
      data:
        # Sphere's sphere.rolePassword only emits the postgresql+asyncpg scheme on
        # fqdn-uri (external host); in-cluster consumers use the short uri, so the
        # scheme is rewritten here rather than in the shared _sphere.tpl helper
        # (same per-consumer approach as inbox-zero-db.yaml's ?schema=public append).
        DATABASE_URL: '{{ `{{ .dbUri | replace "postgresql://" "postgresql+asyncpg://" }}` }}'
        SECRET_KEY: "{{ `{{ .SECRET_KEY }}` }}"
        AGENTS_MCP_JWT_SECRET: "{{ `{{ .AGENTS_MCP_JWT_SECRET }}` }}"
        OIDC_CLIENT_ID: "{{ `{{ .OIDC_CLIENT_ID }}` }}"
        OIDC_CLIENT_SECRET: "{{ `{{ .OIDC_CLIENT_SECRET }}` }}"
        PLUGGY_CLIENT_ID: "{{ `{{ .PLUGGY_CLIENT_ID }}` }}"
        PLUGGY_CLIENT_SECRET: "{{ `{{ .PLUGGY_CLIENT_SECRET }}` }}"
  data:
    - secretKey: dbUri
      remoteRef:
        key: storage/sphere-securo
        property: uri
    - secretKey: SECRET_KEY
      remoteRef:
        key: securo/app
        property: SECRET_KEY
    - secretKey: AGENTS_MCP_JWT_SECRET
      remoteRef:
        key: securo/app
        property: AGENTS_MCP_JWT_SECRET
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: securo/app
        property: OIDC_CLIENT_ID
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: securo/app
        property: OIDC_CLIENT_SECRET
    - secretKey: PLUGGY_CLIENT_ID
      remoteRef:
        key: securo/app
        property: PLUGGY_CLIENT_ID
    - secretKey: PLUGGY_CLIENT_SECRET
      remoteRef:
        key: securo/app
        property: PLUGGY_CLIENT_SECRET
{{- end }}

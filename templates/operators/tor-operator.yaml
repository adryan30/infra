apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tor
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    name: tor
spec:
  project: default
  source:
    repoURL: https://bugfest.github.io/tor-controller
    targetRevision: 0.1.17
    chart: tor-controller
    helm:
      valuesObject:
        # gcr.io/kubebuilder/kube-rbac-proxy:v0.8.0 was removed; chart still defaults there.
        kubeRbacProxy:
          image:
            repository: quay.io/brancz/kube-rbac-proxy
            tag: v0.8.0

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  # Chart CRDs embed `required: null`; the apiserver drops nulls, so live omits the
  # key and Argo stays OutOfSync forever (projectconfigs has none and stays Synced).
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .. | .required? | select(. == null)

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sphere
  namespace: storage
spec:
  instances: 2
  storage:
    size: 10Gi
  managed:
    roles:
      - name: app
        createdb: true
        login: true
        superuser: true
      - name: keycloak
        createdb: false
        login: true
        passwordSecret:
          name: sphere-keycloak
      - name: riven
        createdb: false
        login: true
        passwordSecret:
          name: sphere-riven
      - name: zilean
        createdb: false
        login: true
        passwordSecret:
          name: sphere-zilean
      - name: botato
        createdb: false
        login: true
        passwordSecret:
          name: sphere-botato
      - name: comet
        createdb: false
        login: true
        passwordSecret:
          name: sphere-comet
      - name: inboxzero
        createdb: false
        login: true
        passwordSecret:
          name: sphere-inboxzero
      - name: securo
        createdb: false
        login: true
        passwordSecret:
          name: sphere-securo
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: keycloak-db
  namespace: storage
spec:
  name: keycloak
  owner: keycloak
  cluster:
    name: sphere
  schemas:
    - name: keycloak
      owner: keycloak
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: riven-db
  namespace: storage
spec:
  name: riven
  owner: riven
  cluster:
    name: sphere
  schemas:
    - name: riven
      owner: riven
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: zilean-db
  namespace: storage
spec:
  name: zilean
  owner: zilean
  cluster:
    name: sphere
  schemas:
    - name: zilean
      owner: zilean
      ensure: absent
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: botato-db
  namespace: storage
spec:
  name: botato
  owner: botato
  cluster:
    name: sphere
  schemas:
    - name: botato
      owner: botato
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: comet-db
  namespace: storage
spec:
  name: comet
  owner: comet
  cluster:
    name: sphere
  schemas:
    - name: comet
      owner: comet
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: inboxzero-db
  namespace: storage
spec:
  name: inboxzero
  owner: inboxzero
  cluster:
    name: sphere
  schemas:
    - name: inboxzero
      owner: inboxzero
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: securo-db
  namespace: storage
spec:
  name: securo
  owner: securo
  cluster:
    name: sphere
  schemas:
    - name: securo
      owner: securo
  # securo's migration does `CREATE EXTENSION IF NOT EXISTS vector` (RAG
  # embeddings) — the securo role has no superuser/CREATE-extension
  # privilege, so the operator (which does have it) creates it declaratively
  # instead of widening the role's grants.
  extensions:
    - name: vector
      ensure: present

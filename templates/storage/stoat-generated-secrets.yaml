# Generate RabbitMQ/MinIO/LiveKit credentials exactly once and pin them to
# Vault, mirroring stoat-mongo-app-user in stoat-mongo.yaml. Without this,
# stoat-config.yaml pulled these directly via generatorRef `dataFrom` —
# functionally fine while that ExternalSecret was never touched again, but
# any future edit to stoat-config.yaml (even something unrelated, like the
# LiveKit webhook path) forces ESO to re-reconcile the whole resource, which
# re-invokes the generator and produces brand new random values. RabbitMQ and
# MinIO only read their password at container startup, so every edit to
# stoat-config.yaml would silently re-break them (found live, twice, while
# debugging voice connectivity with the user). Pinning generation to its own
# dedicated one-time resource here makes stoat-config.yaml safe to edit
# freely — it now only ever reads the already-fixed value from Vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stoat-generated-secrets
  namespace: storage
spec:
  refreshInterval: "0"
  target:
    name: stoat-generated-secrets
    template:
      data:
        RABBIT_PASSWORD: "{{ `{{ .RABBIT_PASSWORD }}` }}"
        MINIO_ROOT_USER: "{{ `{{ .MINIO_ROOT_USER }}` }}"
        MINIO_ROOT_PASSWORD: "{{ `{{ .MINIO_ROOT_PASSWORD }}` }}"
        LIVEKIT_KEY: "{{ `{{ .LIVEKIT_KEY }}` }}"
        LIVEKIT_SECRET: "{{ `{{ .LIVEKIT_SECRET }}` }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: "general-passgen"
      rewrite:
        - regexp:
            source: "password"
            target: "RABBIT_PASSWORD"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: "general-passgen"
      rewrite:
        - regexp:
            source: "password"
            target: "MINIO_ROOT_USER"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: "general-passgen"
      rewrite:
        - regexp:
            source: "password"
            target: "MINIO_ROOT_PASSWORD"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: "general-passgen"
      rewrite:
        - regexp:
            source: "password"
            target: "LIVEKIT_KEY"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: "general-passgen"
      rewrite:
        - regexp:
            source: "password"
            target: "LIVEKIT_SECRET"
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: stoat-generated-secrets-pushsecret
  namespace: storage
spec:
  deletionPolicy: Delete
  refreshInterval: 10s
  secretStoreRefs:
    - name: vault
      kind: ClusterSecretStore
  selector:
    secret:
      name: stoat-generated-secrets
  data:
    - match:
        secretKey: RABBIT_PASSWORD
        remoteRef:
          remoteKey: storage/stoat-generated
          property: RABBIT_PASSWORD
    - match:
        secretKey: MINIO_ROOT_USER
        remoteRef:
          remoteKey: storage/stoat-generated
          property: MINIO_ROOT_USER
    - match:
        secretKey: MINIO_ROOT_PASSWORD
        remoteRef:
          remoteKey: storage/stoat-generated
          property: MINIO_ROOT_PASSWORD
    - match:
        secretKey: LIVEKIT_KEY
        remoteRef:
          remoteKey: storage/stoat-generated
          property: LIVEKIT_KEY
    - match:
        secretKey: LIVEKIT_SECRET
        remoteRef:
          remoteKey: storage/stoat-generated
          property: LIVEKIT_SECRET

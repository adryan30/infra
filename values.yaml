spec:
  destination:
    server: https://kubernetes.default.svc

# Workload enablement registry (ADR-0003). Applications and chart-Workload
# companions (VirtualServices, ExternalSecrets, oauth hosts, mounts,
# consumer-side Sphere credential projections) look up by name.
# This registry is the only Workload disable path — not comment-out or
# chart-local replicaCount: 0 (scale-to-zero parks replicas; Workload stays on).
#
# Platform oauth hosts (non-Workload) stay outside the registry.
platform:
  oauthHosts:
    - kiali.adryan.me

workloads:
  botato:
    enabled: true
    ingress: []
  breezewiki:
    enabled: true
    ingress:
      - name: breezewiki
        host: breeze.adryan.me
        oauth: false
        backend:
          host: breezewiki.breezewiki.svc.cluster.local
          port: 10416
  calibre:
    enabled: true
    ingress:
      - name: calibre
        host: calibre.adryan.me
        oauth: false
        backend:
          host: calibre-main.books.svc.cluster.local
          port: 8083
      - name: calibre-downloader
        host: cdownloader.adryan.me
        oauth: true
        backend:
          host: calibre-downloader.books.svc.cluster.local
          port: 8084
  cert-manager:
    enabled: true
    ingress: []
  comet:
    enabled: true
    ingress:
      - name: comet
        host: comet.adryan.me
        oauth: false
        backend:
          host: comet.comet.svc.cluster.local
          port: 8000
  csi-driver-rclone:
    enabled: true
    ingress: []
  devices:
    enabled: true
    ingress: []
  homepage:
    enabled: true
    ingress:
      - name: homepage
        host: home.adryan.me
        oauth: false
        backend:
          host: homepage.homepage.svc.cluster.local
          port: 3000
  inbox-zero:
    enabled: false
    ingress:
      - name: inbox-zero
        host: inbox.adryan.me
        oauth: false
        backend:
          host: inbox-zero-web.inbox-zero.svc.cluster.local
          port: 80
  keycloak:
    enabled: true
    ingress:
      - name: keycloak
        host: auth.adryan.me
        oauth: false
        backend:
          host: keycloak.keycloak.svc.cluster.local
          port: 8080
  longhorn:
    enabled: true
    ingress:
      - name: longhorn
        host: longhorn.adryan.me
        oauth: true
        backend:
          host: longhorn-frontend.longhorn.svc.cluster.local
          port: 80
  metrics-server:
    enabled: true
    ingress: []
  minecraft:
    enabled: true
    ingress: []
  monitoring:
    enabled: true
    ingress:
      - name: grafana
        host: grafana.adryan.me
        oauth: true
        backend:
          host: monitoring-grafana.monitoring.svc.cluster.local
          port: 80
      - name: prometheus
        host: prometheus.adryan.me
        oauth: true
        backend:
          host: monitoring-prometheus.monitoring.svc.cluster.local
          port: 9090
  netbird:
    enabled: true
    ingress:
      - name: netbird
        host: netbird.adryan.me
        oauth: false
        backend:
          host: netbird-dashboard.netbird.svc.cluster.local
          port: 80
      - name: netbird-api
        host: netbird-api.adryan.me
        oauth: false
        backend:
          host: netbird-management.netbird.svc.cluster.local
          port: 80
      - name: netbird-signal
        host: netbird-signal.adryan.me
        oauth: false
        backend:
          host: netbird-signal.netbird.svc.cluster.local
          port: 80
      - name: netbird-relay
        host: netbird-relay.adryan.me
        oauth: false
        backend:
          host: netbird-relay.netbird.svc.cluster.local
          port: 33080
  oauth2-proxy:
    enabled: true
    ingress: []
  openclaw:
    enabled: true
    ingress:
      - name: openclaw
        host: claw.adryan.me
        oauth: true
        backend:
          host: openclaw.openclaw.svc.cluster.local
          port: 18789
  reloader:
    enabled: true
    ingress: []
  rustdesk:
    enabled: true
    ingress: []
  stoat:
    enabled: true
    # Path-based routing across multiple backend Services (api/events/autumn/
    # january/gifbox/livekit/voice-ingress/web) — the generic single-backend
    # VirtualService helper can't express this. See
    # templates/istio/virtualservices/stoat.yaml for the hand-written VS.
    ingress: []
  storyteller:
    enabled: true
    ingress:
      - name: storyteller
        host: storyteller.adryan.me
        oauth: false
        backend:
          host: storyteller.books.svc.cluster.local
          port: 8001
  suwayomi:
    enabled: false
    ingress:
      - name: suwayomi
        host: suwayomi.adryan.me
        oauth: false
        backend:
          host: suwayomi.books.svc.cluster.local
          port: 4567
  tailscale:
    enabled: true
    ingress: []
  teamspeak:
    enabled: true
    ingress: []
  vault:
    enabled: true
    ingress:
      - name: vault
        host: vault.adryan.me
        oauth: false
        backend:
          host: vault.vault.svc.cluster.local
          port: 8200
